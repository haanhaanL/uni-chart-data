<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>日榜 · 腾讯音乐由你榜 TOP3</title>
<script src="https://cdn.bootcdn.net/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<link rel="stylesheet" href="common.css">
<style>
    .score-row {
        display: flex; flex-wrap: wrap; gap: 12px; width: 100%;
        margin-bottom: 12px; align-items: flex-start;
    }
    .score-table-col {
        flex: 2 1 0; min-width: 280px; max-width: 100%;
        display: flex; flex-direction: column;
    }
    .score-chart-col { flex: 1 1 0; min-width: 0; }

    .score-table-col .card {
        height: 520px; display: flex; flex-direction: column; overflow: hidden;
    }
    .score-chart-col .card {
        height: 520px; display: flex; flex-direction: column;
    }

    @media (max-width: 900px) {
        .score-row { flex-direction: column; align-items: stretch; }
        .score-table-col, .score-chart-col {
            flex: 1 1 100%; width: 100%; min-width: 0; max-width: 100%;
        }
        .score-table-col .card, .score-chart-col .card {
            height: auto; min-height: 0;
        }
        .score-table-col .card { max-height: 420px; overflow: hidden; }
        .chart-wrapper-flex { height: 280px; flex: none; }
        .recent-table { min-width: 720px; font-size: 11px; }
        .recent-table th, .recent-table td { padding: 6px 4px; }
        .recent-table .song-cell { max-width: 150px; }
    }
</style>
</head>
<body>
<div class="container">
    <div id="loading">正在加载数据...</div>

    <div id="content" style="display:none;">
        <div class="range-hint" style="margin-bottom:8px;">
            00:00–06:00 数据不更新（<span id="dailyTopDate" style="color:#ea3690;font-weight:bold;"></span>）
        </div>
        <div class="score-row">
            <div class="score-table-col">
                <div class="card">
                    <div class="title">日榜 · 当日最近10条</div>
                    <div class="table-scroll-box">
                        <table class="recent-table">
                            <colgroup>
                                <col style="width: 14%;">
                                <col style="width: 18%;"><col style="width: 12%;">
                                <col style="width: 18%;"><col style="width: 12%;">
                                <col style="width: 18%;"><col style="width: 12%;">
                            </colgroup>
                            <thead>
                                <tr>
                                    <th rowspan="2">时间</th>
                                    <th colspan="2">1</th>
                                    <th colspan="2">2</th>
                                    <th colspan="2">3</th>
                                </tr>
                                <tr>
                                    <th>歌名-歌手</th><th>总分 / 增幅</th>
                                    <th>歌名-歌手</th><th>总分 / 增幅</th>
                                    <th>歌名-歌手</th><th>总分 / 增幅</th>
                                </tr>
                            </thead>
                            <tbody id="dailyTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
            <div class="score-chart-col">
                <div class="card">
                    <div class="title">日榜 · 总分</div>
                    <div class="range-tabs" data-chart="dailyScore">
                        <button class="range-btn active" data-range="today">今日</button>
                        <button class="range-btn" data-range="7d0">近7日</button>
                    </div>
                    <div class="chart-legend-text" id="dailyLegend"></div>
                    <div class="chart-wrapper-flex" id="chartDaily"></div>
                </div>
            </div>
        </div>

        <div class="dim-row">
            <div class="dim-card">
                <div class="title">日榜 · 播放热度</div>
                <div class="table-scroll-box">
                    <table class="recent-table">
                        <colgroup>
                            <col style="width: 16%;">
                            <col style="width: 18%;"><col style="width: 14%;">
                            <col style="width: 18%;"><col style="width: 14%;">
                            <col style="width: 18%;"><col style="width: 14%;">
                        </colgroup>
                        <thead>
                            <tr>
                                <th rowspan="2">时间</th>
                                <th colspan="2">1</th>
                                <th colspan="2">2</th>
                                <th colspan="2">3</th>
                            </tr>
                            <tr>
                                <th>歌名-歌手</th><th>热度 / 增幅</th>
                                <th>歌名-歌手</th><th>热度 / 增幅</th>
                                <th>歌名-歌手</th><th>热度 / 增幅</th>
                            </tr>
                        </thead>
                        <tbody id="dailyHeatTableBody"></tbody>
                    </table>
                </div>
            </div>
            <div class="dim-card">
                <div class="title">日榜 · 畅销度</div>
                <div class="table-scroll-box">
                    <table class="recent-table">
                        <colgroup>
                            <col style="width: 16%;">
                            <col style="width: 18%;"><col style="width: 14%;">
                            <col style="width: 18%;"><col style="width: 14%;">
                            <col style="width: 18%;"><col style="width: 14%;">
                        </colgroup>
                        <thead>
                            <tr>
                                <th rowspan="2">时间</th>
                                <th colspan="2">1</th>
                                <th colspan="2">2</th>
                                <th colspan="2">3</th>
                            </tr>
                            <tr>
                                <th>歌名-歌手</th><th>畅销度 / 增幅</th>
                                <th>歌名-歌手</th><th>畅销度 / 增幅</th>
                                <th>歌名-歌手</th><th>畅销度 / 增幅</th>
                            </tr>
                        </thead>
                        <tbody id="dailySalesTableBody"></tbody>
                    </table>
                </div>
            </div>
            <div class="dim-card">
                <div class="title">日榜 · 推荐度</div>
                <div class="table-scroll-box">
                    <table class="recent-table">
                        <colgroup>
                            <col style="width: 16%;">
                            <col style="width: 18%;"><col style="width: 14%;">
                            <col style="width: 18%;"><col style="width: 14%;">
                            <col style="width: 18%;"><col style="width: 14%;">
                        </colgroup>
                        <thead>
                            <tr>
                                <th rowspan="2">时间</th>
                                <th colspan="2">1</th>
                                <th colspan="2">2</th>
                                <th colspan="2">3</th>
                            </tr>
                            <tr>
                                <th>歌名-歌手</th><th>推荐度 / 增幅</th>
                                <th>歌名-歌手</th><th>推荐度 / 增幅</th>
                                <th>歌名-歌手</th><th>推荐度 / 增幅</th>
                            </tr>
                        </thead>
                        <tbody id="dailyRecommendTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="common.js"></script>
<script>
const chartDaily = echarts.init(document.getElementById('chartDaily'));
chartDaily.showLoading();

function refreshDailyTopDate() {
    const el = document.getElementById('dailyTopDate');
    if (el) el.textContent = fmtDateLabel(getTodayDateForDaily());
}

function renderDailyRecentTable(rows, tbodyId, field) {
    const tbody = document.getElementById(tbodyId);
    if (!rows.length) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:#999;">暂无数据</td></tr>';
        return;
    }

    const list = calcDailyDeltaList(rows);
    if (!list.length) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:#999;">暂无数据</td></tr>';
        return;
    }

    const recent = list.slice(-10).reverse();

    const htmlRows = recent.map(({ row: r, deltas }) => {
        const displayTime = stripYear(r['时间'] || '');
        const cells = [`<td>${displayTime}</td>`];
        for (let rank = 1; rank <= 3; rank++) {
            const name = r[`第${rank}名歌名`] || '';
            const singer = r[`第${rank}名歌手`] || '';
            const song = singer ? `${name}-${singer}` : name;
            const score = r[`第${rank}名${field}`] || '';

            let changeText = '-';
            let cls = '';
            const d = deltas[rank];
            if (d !== null && !isNaN(d)) {
                const fixed = d.toFixed(2);
                changeText = (d > 0 ? '+' : '') + fixed;
                cls = d > 0 ? 'up' : 'flat';
            }

            cells.push(`<td class="song-cell" title="${song}">${song}</td>`);
            cells.push(`<td><span class="val-score">${score}</span> / <span class="${cls}">${changeText}</span></td>`);
        }
        return `<tr>${cells.join('')}</tr>`;
    });

    const placeholderCount = 10 - recent.length;
    for (let i = 0; i < placeholderCount; i++) {
        htmlRows.push(`<tr class="placeholder-row">
            <td>&nbsp;</td>
            <td>&nbsp;</td><td>&nbsp;</td>
            <td>&nbsp;</td><td>&nbsp;</td>
            <td>&nbsp;</td><td>&nbsp;</td>
        </tr>`);
    }

    tbody.innerHTML = htmlRows.join('');
}

function buildDailyChartAxis(rows, range) {
    const allSorted = [...rows].sort((a, b) => (a['时间'] || '').localeCompare(b['时间'] || ''));
    let rowsByColumn = [];
    let times = [];
    let fullTimes = [];

    if (range === '7d0') {
        const effectiveToday = getTodayDateForDaily();
        const rowByKey = {};
        const dayRowsMap = {};
        allSorted.forEach(r => {
            const t = parseTime(r['时间']);
            if (!t) return;
            const key = `${fmtDateKey(t)} ${String(t.getHours()).padStart(2, '0')}:${String(t.getMinutes()).padStart(2, '0')}`;
            rowByKey[key] = r;

            const eff = new Date(t);
            if (t.getHours() === 0 && t.getMinutes() < 10) {
                eff.setDate(eff.getDate() - 1);
            }
            const dayKey = fmtDateKey(eff);
            if (!dayRowsMap[dayKey]) dayRowsMap[dayKey] = [];
            dayRowsMap[dayKey].push(r);
        });

        for (let i = 6; i >= 0; i--) {
            const d = new Date(effectiveToday);
            d.setDate(d.getDate() - i);
            const dayKey = fmtDateKey(d);
            const nextDay = new Date(d);
            nextDay.setDate(nextDay.getDate() + 1);
            const nextKey = fmtDateKey(nextDay);

            const row = findNextDay0006OrPrev(nextKey, rowByKey, dayRowsMap, dayKey);
            if (row) {
                const rowCopy = { ...row };
                rowCopy.__actualLabel = row['时间'] || '';
                rowsByColumn.push(rowCopy);
            } else {
                rowsByColumn.push(null);
            }
            const label = `${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
            times.push(label);
            fullTimes.push(label);
        }
    } else {
        const list = calcDailyDeltaList(rows);
        const mapByHHMM = {};
        list.forEach(({ row, deltas }) => {
            const t = parseTime(row['时间']);
            if (!t) return;
            const hhmm = `${String(t.getHours()).padStart(2, '0')}:${String(t.getMinutes()).padStart(2, '0')}`;
            if (!mapByHHMM[hhmm]) {
                mapByHHMM[hhmm] = { row, deltas };
            }
        });

        for (let h = 6; h <= 23; h++) {
            const hhmm = `${String(h).padStart(2, '0')}:06`;
            const hit = mapByHHMM[hhmm];
            if (hit) {
                const rowCopy = { ...hit.row };
                rowCopy.__tableDelta = hit.deltas;
                rowsByColumn.push(rowCopy);
            } else {
                rowsByColumn.push(null);
            }
            times.push(hhmm);
            fullTimes.push(hhmm);
        }

        const hhmm0 = '00:06';
        const hit0 = mapByHHMM[hhmm0];
        if (hit0) {
            const rowCopy = { ...hit0.row };
            rowCopy.__tableDelta = hit0.deltas;
            rowsByColumn.push(rowCopy);
        } else {
            rowsByColumn.push(null);
        }
        times.push(hhmm0);
        fullTimes.push(hhmm0);
    }

    return { rowsByColumn, times, fullTimes };
}

function renderDailyChart(rows, range) {
    const legendEl = document.getElementById('dailyLegend');
    const { rowsByColumn, times, fullTimes } = buildDailyChartAxis(rows, range);

    let latest = null;
    for (let i = rowsByColumn.length - 1; i >= 0; i--) {
        if (rowsByColumn[i]) { latest = rowsByColumn[i]; break; }
    }

    if (!latest) {
        chartDaily.hideLoading();
        chartDaily.setOption({
            title: { text: '暂无数据', left: 'center', top: 'middle', textStyle: { color: '#999', fontSize: 14 } }
        }, true);
        if (legendEl) legendEl.innerHTML = '';
        return;
    }

    const songKey = (r, rank) => {
        const name = r[`第${rank}名歌名`] || '';
        const singer = r[`第${rank}名歌手`] || '';
        if (!name) return '';
        return singer ? `${singer}-${name}` : name;
    };

    const songOrder = [];
    const songSet = new Set();
    for (let rank = 1; rank <= 3; rank++) {
        const key = songKey(latest, rank);
        if (key && !songSet.has(key)) { songSet.add(key); songOrder.push(key); }
    }
    for (let i = rowsByColumn.length - 1; i >= 0; i--) {
        const r = rowsByColumn[i];
        if (!r) continue;
        for (let rank = 1; rank <= 3; rank++) {
            const key = songKey(r, rank);
            if (key && !songSet.has(key)) { songSet.add(key); songOrder.push(key); }
        }
    }

    const songColorMap = {};
    songOrder.forEach((key, idx) => {
        songColorMap[key] = lineColors[idx % lineColors.length];
    });

    const series = songOrder.map(key => ({
        name: key,
        type: 'line',
        data: rowsByColumn.map(r => {
            if (!r) return null;
            for (let rank = 1; rank <= 3; rank++) {
                if (songKey(r, rank) === key) {
                    const s = r[`第${rank}名得分`] || '';
                    return s === '' ? null : parseFloat(s);
                }
            }
            return null;
        }),
        smooth: false,
        symbol: 'circle',
        symbolSize: 4,
        connectNulls: false,
        itemStyle: { color: songColorMap[key] },
        lineStyle: { width: 2, color: songColorMap[key] },
        emphasis: { focus: 'series' },
    }));

    if (legendEl) {
        legendEl.innerHTML = songOrder.map(key =>
            `<span class="item"><span class="dot" style="background:${songColorMap[key]}"></span>${key}</span>`
        ).join('');
    }

    let min = Infinity, max = -Infinity;
    rowsByColumn.forEach(r => {
        if (!r) return;
        for (let rank = 1; rank <= 3; rank++) {
            const s = r[`第${rank}名得分`] || '';
            const v = parseFloat(s);
            if (!isNaN(v)) {
                if (v < min) min = v;
                if (v > max) max = v;
            }
        }
    });

    let yMin, yMax;
    if (!isFinite(min) || !isFinite(max)) {
        yMin = undefined; yMax = (range === 'today' ? 98 : undefined);
    } else {
        const pad = Math.max((max - min) * 0.08, 1);
        yMin = Math.floor((min - pad) / 5) * 5;
        yMax = Math.ceil((max + pad) / 5) * 5;
        if (range === 'today' && yMax > 98) yMax = 98;
        if (yMax <= yMin) yMax = yMin + 5;
    }

    chartDaily.hideLoading();
    chartDaily.setOption({
        tooltip: {
            trigger: 'axis',
            confine: true,
            formatter: function(params) {
                if (!params.length) return '';
                const i = params[0].dataIndex;
                const r = rowsByColumn[i];
                const label = (fullTimes && fullTimes[i]) ? fullTimes[i] : times[i];
                let html = `<div style="font-weight:bold;margin-bottom:4px;">${label}${r ? '' : '（无数据）'}</div>`;
                if (r && r.__actualLabel) {
                    html += `<div style="font-size:11px;color:#999;margin-bottom:2px;">实际：${r.__actualLabel}</div>`;
                }
                if (r) {
                    const sorted = params
                        .filter(p => p.value !== null && p.value !== undefined)
                        .sort((a, b) => b.value - a.value);

                    const useTableDelta = (r.__tableDelta !== undefined && r.__tableDelta !== null);
                    const hideDelta = (range === '7d0');

                    sorted.forEach(p => {
                        let text = '';
                        let color = '#999';

                        if (!hideDelta) {
                            let deltaVal = null;
                            if (useTableDelta) {
                                for (let rank = 1; rank <= 3; rank++) {
                                    if (songKey(r, rank) === p.seriesName) {
                                        const d = r.__tableDelta[rank];
                                        if (d !== null && d !== undefined && !isNaN(d)) {
                                            deltaVal = d;
                                        }
                                        break;
                                    }
                                }
                            }

                            if (deltaVal !== null && !isNaN(deltaVal)) {
                                text = (deltaVal > 0 ? '+' : '') + deltaVal.toFixed(2);
                                color = deltaVal > 0 ? '#ea3690' : '#999';
                            }
                        }

                        html += `<div style="display:flex;align-items:center;gap:2px;min-width:150px;">`
                              + `<span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${p.marker} ${p.seriesName}</span>`
                              + `<span style="width:48px;text-align:right;white-space:nowrap;">${p.value}</span>`
                              + (hideDelta
                                  ? ''
                                  : `<span style="width:48px;text-align:right;white-space:nowrap;color:${color};">${text}</span>`)
                              + `</div>`;
                    });
                }
                return html;
            }
        },
        grid: { left: '2%', right: '5%', bottom: '12%', top: '8%', containLabel: true },
        xAxis: {
            type: 'category',
            boundaryGap: false,
            data: times,
            axisLabel: { interval: 1, fontSize: 10, color: '#888', rotate: 45 },
            axisLine: { lineStyle: { color: '#f0d6e4' } },
        },
        yAxis: {
            type: 'value',
            min: yMin,
            max: yMax,
            minInterval: 1,
            axisLabel: { fontSize: 10, color: '#888' },
            axisLine: { lineStyle: { color: '#f0d6e4' } },
            splitLine: { lineStyle: { color: '#faf0f6' } },
        },
        series: series,
    }, true);
    chartDaily.resize();
}

let dailyRowsCache = [];
let dailyChartRange = 'today';

(async function init() {
    refreshDailyTopDate();

    dailyRowsCache = await loadCsv('uni_chart_daily.csv');

    document.getElementById('loading').style.display = 'none';
    document.getElementById('content').style.display = 'block';

    renderDailyRecentTable(dailyRowsCache, 'dailyTableBody', '得分');
    renderDailyRecentTable(dailyRowsCache, 'dailyHeatTableBody', '播放热度');
    renderDailyRecentTable(dailyRowsCache, 'dailySalesTableBody', '畅销度');
    renderDailyRecentTable(dailyRowsCache, 'dailyRecommendTableBody', '推荐度');

    renderDailyChart(dailyRowsCache, dailyChartRange);

    setInterval(refreshDailyTopDate, 60 * 1000);
})();

document.querySelectorAll('.range-tabs').forEach(wrap => {
    wrap.querySelectorAll('.range-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            wrap.querySelectorAll('.range-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            dailyChartRange = this.dataset.range;
            renderDailyChart(dailyRowsCache, dailyChartRange);
        });
    });
});

let resizeTimer;
window.addEventListener('resize', function() {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function() {
        chartDaily.resize();
    }, 200);
});
</script>
</body>
</html>
