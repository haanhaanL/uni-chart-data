<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>金币</title>
<link rel="stylesheet" href="common.css">
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
  .stats-row.two {
    grid-template-columns: repeat(2, 1fr);
  }

  .coin-cell {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    min-height: 38px;
  }
  .coin-cell input.coin-input {
    width: 100%;
    max-width: 120px;
    height: 30px;
    padding: 0 6px;
    text-align: center;
    line-height: 28px;
    background: white;
    border: 1px solid #f0d6e4;
    border-radius: 6px;
    color: #333;
    font-size: 12px;
    font-weight: bold;
    outline: none;
    transition: 0.15s;
    font-family: inherit;
    -moz-appearance: textfield;
    appearance: textfield;
  }
  .coin-cell input.coin-input::-webkit-outer-spin-button,
  .coin-cell input.coin-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .coin-cell input.coin-input:focus {
    border-color: #ea3690;
    box-shadow: 0 0 0 2px rgba(234,54,144,0.12);
  }
  .coin-cell input.coin-input::placeholder { color: #ccc; font-weight: normal; }

  .coin-unit {
    font-size: 11px;
    color: #999;
    font-weight: bold;
    flex-shrink: 0;
  }

  .daily-check {
    width: 22px;
    height: 22px;
    border-radius: 6px;
    border: 2px solid #f0d6e4;
    background: white;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: 0.15s;
    font-size: 14px;
    color: transparent;
    font-weight: bold;
    user-select: none;
  }
  .daily-check:hover { border-color: #f97316; }
  .daily-check.checked { background: #f97316; border-color: #f97316; color: #fff; }

  .del-btn {
    width: 24px; height: 24px; border-radius: 50%;
    border: 1px solid rgba(231,76,60,0.35);
    background: white; color: #e74c3c; font-size: 14px; line-height: 1;
    cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
    transition: 0.15s; font-family: inherit; padding: 0;
  }
  .del-btn:hover { background: rgba(231,76,60,0.1); border-color: #e74c3c; }
  input.coin-input.highlight {
    color: #22c55e;
    border-color: #22c55e;
    background: rgba(34, 197, 94, 0.06);
    font-weight: bold;
  }
</style>
</head>
<body>
  <div class="stats-row two">
    <div class="stat-card"><div class="s-label">总金币</div><div class="s-value" id="totalCoin">0w</div></div>
    <div class="stat-card done"><div class="s-label">已完成</div><div class="s-value" id="doneCount">0 / 0</div></div>
  </div>

  <div class="toolbar">
    <button id="clearDataBtn" class="danger">清空数据</button>
  </div>

  <div class="table-box" id="tableBox"></div>

<script>
(function(){
  const DATA_STORAGE_KEY = 'bang_coin_scores';
  const DAILY_STORAGE_KEY = 'bang_coin_daily';

  let ACCOUNTS = [];
  let data = {};
  let daily = {};
  let dailyDate = '';

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function normalizeName(name) { return String(name).trim().replace(/\s+/g, ' '); }

  function todayStr() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }

  function notifyResize() {
    if (window.parent && window.parent !== window) {
      try {
        window.parent.postMessage({
          type: 'resize',
          module: 'coin',
          height: document.body.scrollHeight
        }, '*');
      } catch(e) {}
    }
  }

  function requestDeleteAccount(name) {
    if (window.parent && window.parent !== window) {
      try {
        window.parent.postMessage({ type: 'delete-account', account: name }, '*');
      } catch(e) {}
    }
  }

  function loadData() {
    try {
      const raw = localStorage.getItem(DATA_STORAGE_KEY);
      if (raw) {
        const obj = JSON.parse(raw);
        if (obj && typeof obj === 'object') return obj;
      }
    } catch(e) {}
    return {};
  }
  function saveData() {
    localStorage.setItem(DATA_STORAGE_KEY, JSON.stringify(data));
  }

  function loadDaily() {
    try {
      const raw = localStorage.getItem(DAILY_STORAGE_KEY);
      if (raw) {
        const obj = JSON.parse(raw);
        if (obj && typeof obj === 'object' && obj.daily && typeof obj.daily === 'object') {
          return {
            daily: obj.daily,
            dailyDate: typeof obj.dailyDate === 'string' ? obj.dailyDate : ''
          };
        }
      }
    } catch(e) {}
    return { daily: {}, dailyDate: '' };
  }
  function saveDaily() {
    localStorage.setItem(DAILY_STORAGE_KEY, JSON.stringify({ daily, dailyDate }));
  }

  function checkDailyReset() {
    const today = todayStr();
    if (dailyDate === today) return false;

    ACCOUNTS.forEach(a => {
      if (!daily[a]) daily[a] = false;
    });
    dailyDate = today;
    saveDaily();
    return true;
  }

  function clearDailyChecksDom() {
    document.querySelectorAll('.daily-check').forEach(el => {
      el.classList.remove('checked');
      el.textContent = '';
    });
    updateStats();
    notifyResize();
  }

  function syncDataWithAccounts() {
    const normalized = {};
    Object.keys(data).forEach(k => {
      const nk = normalizeName(k);
      if (!normalized[nk]) normalized[nk] = data[k];
    });
    data = normalized;

    const normalizedDaily = {};
    Object.keys(daily).forEach(k => {
      const nk = normalizeName(k);
      if (!normalizedDaily[nk]) normalizedDaily[nk] = daily[k];
    });
    daily = normalizedDaily;

    ACCOUNTS.forEach(a => {
      if (data[a] === undefined) data[a] = '';
      if (typeof daily[a] !== 'boolean') daily[a] = false;
    });
    Object.keys(data).forEach(a => { if (!ACCOUNTS.includes(a)) delete data[a]; });
    Object.keys(daily).forEach(a => { if (!ACCOUNTS.includes(a)) delete daily[a]; });
    ACCOUNTS = [...new Set(ACCOUNTS)];
  }

  function renderAll() {
    const box = document.getElementById('tableBox');
    let rows = '';
    if (ACCOUNTS.length === 0) {
      rows = `<tr class="empty-row"><td colspan="4">当前无账号，请在顶部「打榜账号」输入框中添加</td></tr>`;
    } else {
      rows = ACCOUNTS.map((a, idx) => {
        const val = (data[a] !== undefined) ? data[a] : '';
        const isDone = !!daily[a];
        const numVal = parseInt(val, 10);
        const isHigh = !isNaN(numVal) && numVal > 48;
        return `<tr data-acc="${escapeHtml(a)}">
          <td class="account-cell" title="${escapeHtml(a)}"><span class="account-text">${idx + 1}. ${escapeHtml(a)}</span></td>
          <td>
            <div class="coin-cell">
              <input class="coin-input ${isHigh ? 'highlight' : ''}" type="number" min="0" step="1" placeholder="—" data-acc="${escapeHtml(a)}" value="${escapeHtml(val)}">
              <span class="coin-unit">w</span>
            </div>
          </td>
          <td>
            <div class="daily-check ${isDone ? 'checked' : ''}" data-acc="${escapeHtml(a)}" title="${isDone ? '点击取消每日' : '点击标记每日完成'}">${isDone ? '✓' : ''}</div>
          </td>
          <td><button class="del-btn" data-acc="${escapeHtml(a)}" title="删除该账号">×</button></td>
        </tr>`;
      }).join('');
    }

    box.innerHTML = `<table>
      <colgroup>
        <col style="width:88px">
        <col style="width:auto">
        <col style="width:auto">
        <col style="width:36px">
      </colgroup>
      <thead><tr>
        <th style="text-align:left;padding-left:6px;">账号</th>
        <th>金币</th>
        <th>每日</th>
        <th>操作</th>
      </tr></thead>
      <tbody>${rows}</tbody>
      <tfoot><tr>
        <td class="account-cell" style="color:#ea3690;">合计</td>
        <td><div class="col-total" id="foot-coin">0w</div></td>
        <td><div class="col-total" id="foot-done">0 / 0</div></td>
        <td></td>
      </tr></tfoot>
    </table>`;

    box.querySelectorAll('input.coin-input').forEach(inp => {
      inp.addEventListener('input', function(){
        const a = this.dataset.acc;
        data[a] = this.value;
        const n = parseInt(this.value, 10);
        this.classList.toggle('highlight', !isNaN(n) && n > 48);
        saveData();
        updateStats();
        notifyResize();
      });
    });

    box.querySelectorAll('.daily-check').forEach(el => {
      el.addEventListener('click', function(){
        const a = this.dataset.acc;
        if (daily[a] === undefined) daily[a] = false;
        daily[a] = !daily[a];
        if (dailyDate !== todayStr()) dailyDate = todayStr();
        saveDaily();
        this.classList.toggle('checked', daily[a]);
        this.textContent = daily[a] ? '✓' : '';
        updateStats();
        notifyResize();
      });
    });

    box.querySelectorAll('.del-btn').forEach(btn => {
      btn.addEventListener('click', function(){
        requestDeleteAccount(this.dataset.acc);
      });
    });

    updateStats();
    notifyResize();
  }

  function updateStats() {
    let total = 0;
    let done = 0;
    ACCOUNTS.forEach(a => {
      const raw = (data[a] !== undefined) ? data[a] : '';
      const n = parseInt(raw, 10);
      if (!isNaN(n)) total += n;
      if (daily[a]) done++;
    });

    const totalEl = document.getElementById('totalCoin');
    if (totalEl) totalEl.textContent = `${total.toLocaleString()}w`;

    const doneEl = document.getElementById('doneCount');
    if (doneEl) doneEl.textContent = `${done} / ${ACCOUNTS.length}`;

    const footCoin = document.getElementById('foot-coin');
    if (footCoin) footCoin.textContent = `${total.toLocaleString()}w`;

    const footDone = document.getElementById('foot-done');
    if (footDone) footDone.textContent = `${done} / ${ACCOUNTS.length}`;

    notifyResize();
  }

  function clearData() {
    if (!ACCOUNTS.length) { alert('当前没有账号，无需清空数据'); return; }
    let has = false;
    ACCOUNTS.forEach(a => {
      if (data[a] !== undefined && String(data[a]).trim() !== '') has = true;
      if (daily[a]) has = true;
    });
    if (!has) { alert('当前所有金币数据已经是空的'); return; }
    if (!confirm('确定要清空所有账号的金币数据和每日勾选吗？账号列表将保留。')) return;
    ACCOUNTS.forEach(a => {
      data[a] = '';
      daily[a] = false;
    });
    saveData();
    saveDaily();
    renderAll();
  }

  window.addEventListener('message', function(e) {
    if (!e.data || e.data.type !== 'accounts-changed') return;
    const incoming = Array.isArray(e.data.accounts) ? e.data.accounts : [];
    ACCOUNTS = incoming.filter(x => typeof x === 'string' && x.trim() !== '').map(normalizeName);
    data = loadData();
    const dailyLoaded = loadDaily();
    daily = dailyLoaded.daily;
    dailyDate = dailyLoaded.dailyDate;
    syncDataWithAccounts();
    if (checkDailyReset()) {
      saveDaily();
      renderAll();
      clearDailyChecksDom();
    } else {
      saveData();
      saveDaily();
      renderAll();
    }
  });

  // ===== 截图响应（账号打码 ***） =====
  window.addEventListener('message', async function(e) {
    if (!e.data || e.data.type !== 'capture') return;
    try {
      const statsRow = document.querySelector('.stats-row');
      const tableBox = document.querySelector('.table-box');
      if (!statsRow || !tableBox) {
        window.parent.postMessage({ type: 'capture-result', dataURL: null }, '*');
        return;
      }

      // 克隆统计卡片
      const statsClone = statsRow.cloneNode(true);

      // 克隆表格
      const tableClone = tableBox.cloneNode(true);
      // 删除操作列（每行最后一个 td / th）
      tableClone.querySelectorAll('tr').forEach(tr => {
        const cells = tr.children;
        if (cells.length > 0) {
          tr.removeChild(cells[cells.length - 1]);
        }
      });

      // 同步删除 colgroup 里操作列对应的 col
      const colgroup = tableClone.querySelector('colgroup');
      if (colgroup) {
        const cols = colgroup.querySelectorAll('col');
        if (cols.length > 0) {
          colgroup.removeChild(cols[cols.length - 1]);
        }
      }
      tableClone.querySelectorAll('tbody tr').forEach((tr, idx) => {
        const accountText = tr.querySelector('.account-text');
        if (accountText) accountText.textContent = `${idx + 1}.***`;
      });
      tableClone.querySelectorAll('.account-cell').forEach(el => {
        el.removeAttribute('title');
      });
      tableClone.querySelectorAll('[data-acc]').forEach(el => {
        el.setAttribute('data-acc', '***');
      });
      tableClone.scrollLeft = 0;
      tableClone.style.maxHeight = 'none';
      tableClone.style.overflowY = 'visible';

      // 临时容器：宽度至少 800，保证移动端也能完整渲染
      const wrapper = document.createElement('div');
      wrapper.style.background = '#fff';
      wrapper.style.padding = '8px';
      wrapper.style.width = Math.max(tableBox.scrollWidth || 0, 800) + 'px';
      wrapper.style.position = 'fixed';
      wrapper.style.left = '-99999px';
      wrapper.style.top = '0';
      wrapper.style.zIndex = '-1';
      // 截图时放大字号
      const styleOverride = document.createElement('style');
      styleOverride.textContent = `
        .capture-mode table { font-size: 14px !important; }
        .capture-mode th, .capture-mode td { font-size: 14px !important; }
        .capture-mode input { font-size: 14px !important; }`;
      wrapper.classList.add('capture-mode');
      wrapper.appendChild(styleOverride);
      wrapper.appendChild(statsClone);
      wrapper.appendChild(tableClone);
      document.body.appendChild(wrapper);

      // 等一帧让布局稳定
      await new Promise(r => setTimeout(r, 50));

      const canvas = await html2canvas(wrapper, {
        backgroundColor: '#ffffff',
        scale: 2,
        useCORS: true,
        logging: false,
        width: wrapper.scrollWidth,
        height: wrapper.scrollHeight
      });

      document.body.removeChild(wrapper);

      const dataURL = canvas.toDataURL('image/png');
      window.parent.postMessage({ type: 'capture-result', dataURL: dataURL }, '*');
    } catch(err) {
      console.error('capture failed', err);
      window.parent.postMessage({ type: 'capture-result', dataURL: null }, '*');
    }
  });

  function init() {
    data = loadData();
    const dailyLoaded = loadDaily();
    daily = dailyLoaded.daily;
    dailyDate = dailyLoaded.dailyDate;

    syncDataWithAccounts();
    if (checkDailyReset()) {
      renderAll();
      clearDailyChecksDom();
    } else {
      renderAll();
    }

    document.getElementById('clearDataBtn').addEventListener('click', clearData);

    setInterval(() => {
      if (checkDailyReset()) {
        clearDailyChecksDom();
      }
    }, 60 * 1000);

    document.addEventListener('visibilitychange', function() {
      if (!document.hidden) {
        if (checkDailyReset()) {
          clearDailyChecksDom();
        }
      }
    });
  }
  init();
})();
</script>
</body>
</html>
