<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>刷播</title>
<link rel="stylesheet" href="common.css">
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
  .stats-row.single {
    grid-template-columns: 1fr;
  }

  .play-check {
    width: 22px;
    height: 22px;
    border-radius: 6px;
    border: 2px solid #f0d6e4;
    background: white;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: 0.15s;
    font-size: 14px;
    color: transparent;
    font-weight: bold;
    user-select: none;
  }
  .play-check:hover { border-color: #f97316; }
  .play-check.checked { background: #f97316; border-color: #f97316; color: #fff; }

  .del-btn {
    width: 24px; height: 24px; border-radius: 50%;
    border: 1px solid rgba(231,76,60,0.35);
    background: white; color: #e74c3c; font-size: 14px; line-height: 1;
    cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
    transition: 0.15s; font-family: inherit; padding: 0;
  }
  .del-btn:hover { background: rgba(231,76,60,0.1); border-color: #e74c3c; }
</style>
</head>
<body>
  <div class="stats-row single">
    <div class="stat-card"><div class="s-label">总完成数</div><div class="s-value" id="totalDone">0 / 0</div></div>
  </div>

  <div class="toolbar">
    <button id="clearDataBtn" class="danger">清空数据</button>
  </div>

  <div class="table-box" id="tableBox"></div>

<script>
(function(){
  const PLATFORMS = ['q音', '酷狗', '酷我'];
  const DATA_STORAGE_KEY = 'bang_play_state';

  let ACCOUNTS = [];
  let data = {};

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function normalizeName(name) { return String(name).trim().replace(/\s+/g, ' '); }

  function notifyResize() {
    if (window.parent && window.parent !== window) {
      try {
        window.parent.postMessage({
          type: 'resize',
          module: 'play',
          height: document.body.scrollHeight
        }, '*');
      } catch(e) {}
    }
  }

  function requestDeleteAccount(name) {
    if (window.parent && window.parent !== window) {
      try {
        window.parent.postMessage({ type: 'delete-account', account: name }, '*');
      } catch(e) {}
    }
  }

  function loadData() {
    try {
      const raw = localStorage.getItem(DATA_STORAGE_KEY);
      if (raw) {
        const obj = JSON.parse(raw);
        if (obj && typeof obj === 'object') return obj;
      }
    } catch(e) {}
    return {};
  }
  function saveData() {
    localStorage.setItem(DATA_STORAGE_KEY, JSON.stringify(data));
  }

  function syncDataWithAccounts() {
    const normalized = {};
    Object.keys(data).forEach(k => {
      const nk = normalizeName(k);
      if (!normalized[nk]) normalized[nk] = data[k];
    });
    data = normalized;

    ACCOUNTS.forEach(a => {
      if (!data[a]) data[a] = {};
      PLATFORMS.forEach(p => {
        if (typeof data[a][p] !== 'boolean') data[a][p] = false;
      });
    });
    Object.keys(data).forEach(a => { if (!ACCOUNTS.includes(a)) delete data[a]; });
    ACCOUNTS = [...new Set(ACCOUNTS)];
  }

  function renderAll() {
    const box = document.getElementById('tableBox');
    let rows = '';
    if (ACCOUNTS.length === 0) {
      rows = `<tr class="empty-row"><td colspan="${PLATFORMS.length + 2}">当前无账号，请在顶部「打榜账号」输入框中添加</td></tr>`;
    } else {
      rows = ACCOUNTS.map((a, idx) => {
        const rec = data[a] || {};
        return `<tr data-acc="${escapeHtml(a)}">
          <td class="account-cell" title="${escapeHtml(a)}"><span class="account-text">${idx + 1}. ${escapeHtml(a)}</span></td>
          ${PLATFORMS.map(p => {
            const checked = !!rec[p];
            return `<td>
              <div class="play-check ${checked ? 'checked' : ''}" data-acc="${escapeHtml(a)}" data-pf="${escapeHtml(p)}" title="${checked ? '点击取消' : '点击标记完成'}">${checked ? '✓' : ''}</div>
            </td>`;
          }).join('')}
          <td><button class="del-btn" data-acc="${escapeHtml(a)}" title="删除该账号">×</button></td>
        </tr>`;
      }).join('');
    }

    const footCells = PLATFORMS.map((_, i) => `<td><div class="col-total" id="pct-${i}">0 / 0</div></td>`).join('');

    box.innerHTML = `<table>
      <colgroup>
        <col style="width:88px">
        <col style="width:auto">
        <col style="width:auto">
        <col style="width:auto">
        <col style="width:36px">
      </colgroup>
      <thead><tr>
        <th style="text-align:left;padding-left:6px;">账号</th>
        ${PLATFORMS.map(p => `<th>${p}</th>`).join('')}
        <th>操作</th>
      </tr></thead>
      <tbody>${rows}</tbody>
      <tfoot><tr>
        <td class="account-cell" style="color:#ea3690;">合计</td>
        ${footCells}
        <td></td>
      </tr></tfoot>
    </table>`;

    box.querySelectorAll('.play-check').forEach(el => {
      el.addEventListener('click', function(){
        toggleCheck(this.dataset.acc, this.dataset.pf);
      });
    });

    box.querySelectorAll('.del-btn').forEach(btn => {
      btn.addEventListener('click', function(){
        requestDeleteAccount(this.dataset.acc);
      });
    });

    updateStats();
    notifyResize();
  }

  function toggleCheck(acc, pf) {
    if (!data[acc]) data[acc] = {};
    data[acc][pf] = !data[acc][pf];
    saveData();
    renderAll();
  }

  function updateStats() {
    let done = 0;
    ACCOUNTS.forEach(a => {
      const rec = data[a] || {};
      PLATFORMS.forEach(p => { if (rec[p]) done++; });
    });
    const total = ACCOUNTS.length * PLATFORMS.length;

    const el = document.getElementById('totalDone');
    if (el) el.textContent = `${done} / ${total}`;

    // 表尾各平台完成数
    PLATFORMS.forEach((pf, idx) => {
      let c = 0;
      ACCOUNTS.forEach(a => {
        if (data[a] && data[a][pf]) c++;
      });
      const foot = document.getElementById(`pct-${idx}`);
      if (foot) foot.textContent = `${c} / ${ACCOUNTS.length}`;
    });

    notifyResize();
  }

  function clearData() {
    if (!ACCOUNTS.length) { alert('当前没有账号，无需清空数据'); return; }
    let has = false;
    ACCOUNTS.forEach(a => {
      PLATFORMS.forEach(p => { if (data[a] && data[a][p]) has = true; });
    });
    if (!has) { alert('当前所有刷播记录已经是空的'); return; }
    if (!confirm('确定要清空所有账号的刷播记录吗？账号列表将保留。')) return;
    ACCOUNTS.forEach(a => {
      if (!data[a]) data[a] = {};
      PLATFORMS.forEach(p => { data[a][p] = false; });
    });
    saveData();
    renderAll();
  }

  window.addEventListener('message', function(e) {
    if (!e.data || e.data.type !== 'accounts-changed') return;
    const incoming = Array.isArray(e.data.accounts) ? e.data.accounts : [];
    ACCOUNTS = incoming.filter(x => typeof x === 'string' && x.trim() !== '').map(normalizeName);
    data = loadData();
    syncDataWithAccounts();
    saveData();
    renderAll();
  });

  // ===== 截图响应（账号打码 ***） =====
  window.addEventListener('message', async function(e) {
    if (!e.data || e.data.type !== 'capture') return;
    try {
      const statsRow = document.querySelector('.stats-row');
      const tableBox = document.querySelector('.table-box');
      if (!statsRow || !tableBox) {
        window.parent.postMessage({ type: 'capture-result', dataURL: null }, '*');
        return;
      }

      // 克隆统计卡片
      const statsClone = statsRow.cloneNode(true);

      // 克隆表格
      const tableClone = tableBox.cloneNode(true);
      // 删除操作列（每行最后一个 td / th）
      tableClone.querySelectorAll('tr').forEach(tr => {
        const cells = tr.children;
        if (cells.length > 0) {
          tr.removeChild(cells[cells.length - 1]);
        }
      });

      // 同步删除 colgroup 里操作列对应的 col
      const colgroup = tableClone.querySelector('colgroup');
      if (colgroup) {
        const cols = colgroup.querySelectorAll('col');
        if (cols.length > 0) {
          colgroup.removeChild(cols[cols.length - 1]);
        }
      }
      tableClone.querySelectorAll('tbody tr').forEach((tr, idx) => {
        const accountText = tr.querySelector('.account-text');
        if (accountText) accountText.textContent = `${idx + 1}.***`;
      });
      tableClone.querySelectorAll('.account-cell').forEach(el => {
        el.removeAttribute('title');
      });
      tableClone.querySelectorAll('[data-acc]').forEach(el => {
        el.setAttribute('data-acc', '***');
      });
      tableClone.scrollLeft = 0;
      tableClone.style.maxHeight = 'none';
      tableClone.style.overflowY = 'visible';

      // 临时容器：宽度至少 800，保证移动端也能完整渲染
      const wrapper = document.createElement('div');
      wrapper.style.background = '#fff';
      wrapper.style.padding = '8px';
      wrapper.style.width = Math.max(tableBox.scrollWidth || 0, 800) + 'px';
      wrapper.style.position = 'fixed';
      wrapper.style.left = '-99999px';
      wrapper.style.top = '0';
      wrapper.style.zIndex = '-1';
      // 截图时放大字号
      const styleOverride = document.createElement('style');
      styleOverride.textContent = `
        .capture-mode table { font-size: 14px !important; }
        .capture-mode th, .capture-mode td { font-size: 14px !important; }
        .capture-mode input { font-size: 14px !important; }`;
      wrapper.classList.add('capture-mode');
      wrapper.appendChild(styleOverride);
      wrapper.appendChild(statsClone);
      wrapper.appendChild(tableClone);
      document.body.appendChild(wrapper);

      // 等一帧让布局稳定
      await new Promise(r => setTimeout(r, 50));

      const canvas = await html2canvas(wrapper, {
        backgroundColor: '#ffffff',
        scale: 2,
        useCORS: true,
        logging: false,
        width: wrapper.scrollWidth,
        height: wrapper.scrollHeight
      });

      document.body.removeChild(wrapper);

      const dataURL = canvas.toDataURL('image/png');
      window.parent.postMessage({ type: 'capture-result', dataURL: dataURL }, '*');
    } catch(err) {
      console.error('capture failed', err);
      window.parent.postMessage({ type: 'capture-result', dataURL: null }, '*');
    }
  });

  function init() {
    data = loadData();
    renderAll();

    document.getElementById('clearDataBtn').addEventListener('click', clearData);
  }
  init();
})();
</script>
</body>
</html>
