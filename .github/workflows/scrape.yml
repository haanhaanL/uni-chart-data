name: 自动抓取由你榜数据

on:
  workflow_dispatch:   # 由 cron-job.org 调用，实现每小时定时运行

concurrency:
  group: scrape-uni-chart-data
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 拉取代码
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: 设置 Python (自带 pip 缓存)
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 缓存 Playwright 浏览器
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/requirements.txt') }}

      - name: 安装 Playwright 浏览器 (有缓存则秒过)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install --with-deps chromium

      - name: 运行抓取脚本
        run: python scrape.py

      - name: 提交更新后的数据
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add uni_chart_data.csv index.html

          if git diff --staged --quiet; then
            echo "没有变更，无需提交"
            exit 0
          fi

          git commit -m "自动更新由你榜数据 $(date -u '+%Y-%m-%d %H:%M')"

          # 快速推送，失败则重试
          for i in 1 2 3; do
            if git push origin HEAD:${{ github.ref_name }}; then
              echo "push 成功"
              exit 0
            fi
            echo "push 失败，第 $i 次重试..."
            git pull --rebase origin ${{ github.ref_name }}
            if [ $? -ne 0 ]; then
              git checkout --ours uni_chart_data.csv index.html 2>/dev/null || true
              git add uni_chart_data.csv index.html 2>/dev/null || true
              git rebase --continue 2>/dev/null || true
            fi
            sleep $((i * 2))
          done
          echo "重试 3 次后仍失败"
          exit 1
