<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>腾讯音乐由你榜 · 前三追踪</title>
<script src="https://cdn.bootcdn.net/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
    body {
        margin: 0; padding: 8px; background-color: #faf7f9;
        font-family: sans-serif;
        display: flex; flex-direction: column; align-items: center; overflow-x: hidden;
    }
    .container { width: 100%; max-width: 1600px; }
    h1 { text-align: center; color: #ea3690; font-size: 18px; margin: 10px 0; }
    .update-time { text-align: center; color: #999; font-size: 12px; margin-bottom: 12px; }

    .tab-bar { display: flex; justify-content: center; gap: 10px; margin-bottom: 14px; }
    .tab-btn {
        border: 1px solid rgba(234,54,144,0.35); background: white; color: #ea3690;
        font-size: 15px; font-weight: bold; padding: 8px 26px; border-radius: 20px;
        cursor: pointer; transition: all 0.2s ease; outline: none;
        font-family: inherit;
    }
    .tab-btn.active {
        background: #ea3690; color: white; border-color: #ea3690;
        box-shadow: 0 3px 10px rgba(234,54,144,0.25);
    }
    .tab-panel { display: none; width: 100%; }
    .tab-panel.active { display: block; }

    .charts-row { display: flex; flex-wrap: wrap; gap: 12px; width: 100%; margin-bottom: 12px; }
    .chart-col-1 { flex: 1 1 100%; min-width: 0; }
    .chart-col-3 { flex: 1 1 320px; min-width: 0; }

    .score-row {
        display: flex; flex-wrap: wrap; gap: 12px; width: 100%;
        margin-bottom: 12px; align-items: flex-start;
    }
    .score-table-col {
        flex: 2 1 0;
        min-width: 280px;
        max-width: 100%;
        display: flex; flex-direction: column;
    }
    .score-chart-col {
        flex: 1 1 0;
        min-width: 0;
    }

    .card {
        background: white; border-radius: 12px; box-shadow: 0 4px 12px rgba(234,54,144,0.08);
        padding: 12px 0; overflow: hidden; border: 1px solid rgba(234,54,144,0.10);
    }
    .title { text-align: center; color: #ea3690; font-size: 15px; font-weight: bold; margin: 5px 0 8px 0; }
    .chart-legend-text {
        text-align: center; font-size: 12px; color: #666; margin: 0 8px 6px 8px; line-height: 1.8;
    }
    .chart-legend-text .item { display: inline-block; margin: 0 5px; }
    .chart-legend-text .dot {
        display: inline-block; width: 8px; height: 8px; border-radius: 50%;
        margin-right: 4px; vertical-align: middle;
    }
    .chart-wrapper { width: 100%; height: 300px; }

    .score-table-col .card {
        height: 520px;
        display: flex; flex-direction: column;
        overflow: hidden;
    }
    .score-chart-col .card {
        height: 520px;
        display: flex; flex-direction: column;
    }
    .chart-wrapper-flex {
        width: 100%;
        flex: 1 1 auto;
        min-height: 0;
    }

    .table-scroll-box {
        width: 100%;
        overflow-x: auto; overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        flex: 1 1 auto; min-height: 0;
        display: flex; flex-direction: column;
    }
    .table-scroll-box::-webkit-scrollbar { display: none; }

    .recent-table {
        width: 100%;
        height: 100%;
        border-collapse: collapse;
        font-size: 12px;
        table-layout: fixed;
        min-width: 720px;
    }
    .recent-table th, .recent-table td {
        padding: 8px 5px; text-align: center; border-bottom: 1px solid #f3e6ee; white-space: nowrap;
        min-height: 36px; line-height: 1.5;
    }
    .recent-table th {
        background-color: #ea3690 !important;
        color: #ffffff;
        font-weight: bold;
        font-size: 11px;
        position: sticky;
        top: 0;
        border: 1px solid rgba(255, 255, 255, 0.3);
        box-shadow: 0 1px 0 #f3e6ee;
    }
    /* ★ 第一列 sticky：不透明背景，奇偶行区分，避免重合 */
    .recent-table td:first-child {
        position: sticky; left: 0; z-index: 1;
        color: #555;
        background-color: #ffffff;
    }
    .recent-table tbody tr:nth-child(even) td:first-child {
        background-color: #fdf7fa;   /* 等效于 #ea36900a 叠白 */
    }
    .recent-table tbody tr:nth-child(even) {
        background-color: #ea36900a;
    }
    .recent-table .song-cell {
        max-width: 130px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        text-align: left;
        color: #555;
    }
    .val-score { font-weight: bold; color: #333; }
    .up { color: #e74c3c; font-weight: bold; }
    .flat, .down { color: #999; font-weight: bold; }

    #loading { text-align: center; color: #999; font-size: 16px; margin-top: 50px; }

    @media (max-width: 900px) {
        .score-row { flex-direction: column; align-items: stretch; }
        .score-table-col, .score-chart-col {
            flex: 1 1 100%; width: 100%; min-width: 0; max-width: 100%;
        }
        .score-table-col .card, .score-chart-col .card {
            height: auto; min-height: 0;
        }
        .score-table-col .card { max-height: 420px; overflow: hidden; }
        .chart-wrapper-flex { height: 280px; flex: none; }

        .table-scroll-box { overflow-x: auto; overflow-y: auto; }
        .recent-table { min-width: 720px; font-size: 11px; }
        .recent-table th, .recent-table td { padding: 6px 4px; }
        .recent-table .song-cell { max-width: 150px; }
    }
</style>
</head>
<body>
<div class="container">
    <h1>腾讯音乐由你榜 · 前三追踪</h1>
    <div class="update-time" id="updateTime"></div>
    <div id="loading">正在加载数据...</div>

    <div id="content" style="display:none;">
        <div class="tab-bar">
            <button class="tab-btn active" data-tab="weekly">周榜</button>
            <button class="tab-btn" data-tab="daily">日榜</button>
        </div>

        <div class="tab-panel active" id="panel-weekly">
            <div class="score-row">
                <div class="score-table-col">
                    <div class="card">
                        <div class="title">周榜 · 最近10条</div>
                        <div class="table-scroll-box">
                            <table class="recent-table">
                                <colgroup>
                                    <col style="width: 14%;">
                                    <col style="width: 18%;"><col style="width: 12%;">
                                    <col style="width: 18%;"><col style="width: 12%;">
                                    <col style="width: 18%;"><col style="width: 12%;">
                                </colgroup>
                                <thead>
                                    <tr>
                                        <th rowspan="2">时间</th>
                                        <th colspan="2">①</th>
                                        <th colspan="2">②</th>
                                        <th colspan="2">③</th>
                                    </tr>
                                    <tr>
                                        <th>歌名-歌手</th><th>得分 / 增幅</th>
                                        <th>歌名-歌手</th><th>得分 / 增幅</th>
                                        <th>歌名-歌手</th><th>得分 / 增幅</th>
                                    </tr>
                                </thead>
                                <tbody id="weeklyTableBody"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
                <div class="score-chart-col">
                    <div class="card">
                        <div class="title">周榜前三得分趋势</div>
                        <div class="chart-legend-text" id="weeklyLegend"></div>
                        <div class="chart-wrapper-flex" id="chartWeekly"></div>
                    </div>
                </div>
            </div>
            <div class="charts-row">
                <div class="chart-col-3">
                    <div class="card">
                        <div class="title">周榜 · 播放热度</div>
                        <div class="chart-legend-text" id="weeklyPlayLegend"></div>
                        <div class="chart-wrapper" id="chartWeeklyPlay"></div>
                    </div>
                </div>
                <div class="chart-col-3">
                    <div class="card">
                        <div class="title">周榜 · 畅销度</div>
                        <div class="chart-legend-text" id="weeklySalesLegend"></div>
                        <div class="chart-wrapper" id="chartWeeklySales"></div>
                    </div>
                </div>
                <div class="chart-col-3">
                    <div class="card">
                        <div class="title">周榜 · 推荐度</div>
                        <div class="chart-legend-text" id="weeklyRecommendLegend"></div>
                        <div class="chart-wrapper" id="chartWeeklyRecommend"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="tab-panel" id="panel-daily">
            <div class="score-row">
                <div class="score-table-col">
                    <div class="card">
                        <div class="title">日榜 · 最近10条</div>
                        <div class="table-scroll-box">
                            <table class="recent-table">
                                <colgroup>
                                    <col style="width: 14%;">
                                    <col style="width: 18%;"><col style="width: 12%;">
                                    <col style="width: 18%;"><col style="width: 12%;">
                                    <col style="width: 18%;"><col style="width: 12%;">
                                </colgroup>
                                <thead>
                                    <tr>
                                        <th rowspan="2">时间</th>
                                        <th colspan="2">①</th>
                                        <th colspan="2">②</th>
                                        <th colspan="2">③</th>
                                    </tr>
                                    <tr>
                                        <th>歌名-歌手</th><th>得分 / 增幅</th>
                                        <th>歌名-歌手</th><th>得分 / 增幅</th>
                                        <th>歌名-歌手</th><th>得分 / 增幅</th>
                                    </tr>
                                </thead>
                                <tbody id="dailyTableBody"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
                <div class="score-chart-col">
                    <div class="card">
                        <div class="title">日榜前三得分趋势</div>
                        <div class="chart-legend-text" id="dailyLegend"></div>
                        <div class="chart-wrapper-flex" id="chartDaily"></div>
                    </div>
                </div>
            </div>
            <div class="charts-row">
                <div class="chart-col-3">
                    <div class="card">
                        <div class="title">日榜 · 播放热度</div>
                        <div class="chart-legend-text" id="dailyPlayLegend"></div>
                        <div class="chart-wrapper" id="chartDailyPlay"></div>
                    </div>
                </div>
                <div class="chart-col-3">
                    <div class="card">
                        <div class="title">日榜 · 畅销度</div>
                        <div class="chart-legend-text" id="dailySalesLegend"></div>
                        <div class="chart-wrapper" id="chartDailySales"></div>
                    </div>
                </div>
                <div class="chart-col-3">
                    <div class="card">
                        <div class="title">日榜 · 推荐度</div>
                        <div class="chart-legend-text" id="dailyRecommendLegend"></div>
                        <div class="chart-wrapper" id="chartDailyRecommend"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
const lineColors = ['#ea3690', '#7c3aed', '#e74c3c', '#2563eb', '#f59e0b', '#10b981', '#8b5cf6', '#ef4444', '#14b8a6', '#f97316'];

const chartDaily = echarts.init(document.getElementById('chartDaily'));
const chartWeekly = echarts.init(document.getElementById('chartWeekly'));
const chartDailyPlay = echarts.init(document.getElementById('chartDailyPlay'));
const chartDailySales = echarts.init(document.getElementById('chartDailySales'));
const chartDailyRecommend = echarts.init(document.getElementById('chartDailyRecommend'));
const chartWeeklyPlay = echarts.init(document.getElementById('chartWeeklyPlay'));
const chartWeeklySales = echarts.init(document.getElementById('chartWeeklySales'));
const chartWeeklyRecommend = echarts.init(document.getElementById('chartWeeklyRecommend'));

const allCharts = [chartDaily, chartWeekly, chartDailyPlay, chartDailySales,
                   chartDailyRecommend, chartWeeklyPlay, chartWeeklySales, chartWeeklyRecommend];
allCharts.forEach(c => c.showLoading());

function colorClass(v) {
    if (v === undefined || v === null || v === '') return '';
    const fv = parseFloat(v);
    if (isNaN(fv)) return '';
    return fv > 0 ? 'up' : 'flat';
}

function stripYear(timeStr) {
    if (!timeStr) return '';
    return timeStr.replace(/^\d{4}[-/]/, '');
}

function renderRecentTable(rows, tbodyId) {
    const tbody = document.getElementById(tbodyId);
    if (!rows.length) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:#999;">暂无数据</td></tr>';
        return;
    }
    const sorted = [...rows].sort((a, b) => (b['时间'] || '').localeCompare(a['时间'] || ''));
    const recent = sorted.slice(0, 10);
    tbody.innerHTML = recent.map(r => {
        const displayTime = stripYear(r['时间'] || '');
        const cells = [`<td>${displayTime}</td>`];
        for (let i = 1; i <= 3; i++) {
            const name = r[`第${i}名歌名`] || '';
            const singer = r[`第${i}名歌手`] || '';
            const song = singer ? `${name}-${singer}` : name;
            const score = r[`第${i}名得分`] || '';
            const change = r[`第${i}名官方增幅`] || '';
            const changeText = change === '' ? '' : '+' + change;
            const cls = colorClass(change);
            cells.push(`<td class="song-cell" title="${song}">${song}</td>`);
            cells.push(`<td><span class="val-score">${score}</span> / <span class="${cls}">${changeText}</span></td>`);
        }
        return `<tr>${cells.join('')}</tr>`;
    }).join('');
}

function renderChart(rows, chartInst, legendId, field, yInterval) {
    const legendEl = document.getElementById(legendId);

    const hourKeyOf = (s) => {
        const m = (s || '').match(/(\d{4})[-/](\d{1,2})[-/](\d{1,2})(?:[ T](\d{1,2}))?/);
        if (!m) return null;
        return `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')} ${String(m[4]||0).padStart(2,'0')}`;
    };
    const rowByHour = {};
    rows.forEach(r => {
        const k = hourKeyOf(r['时间']);
        if (k) rowByHour[k] = r;
    });

    const now = new Date();
    const axisHours = [];
    for (let i = 23; i >= 0; i--) {
        const d = new Date(now.getTime() - i * 60 * 60 * 1000);
        const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}`;
        axisHours.push({ key, label: `${String(d.getHours()).padStart(2,'0')}:00` });
    }

    let latest = null;
    for (let i = axisHours.length - 1; i >= 0; i--) {
        if (rowByHour[axisHours[i].key]) { latest = rowByHour[axisHours[i].key]; break; }
    }

    if (!latest) {
        chartInst.hideLoading();
        chartInst.setOption({
            title: { text: '暂无数据', left: 'center', top: 'middle', textStyle: { color: '#999', fontSize: 14 } }
        }, true);
        if (legendEl) legendEl.innerHTML = '';
        return;
    }

    const times = axisHours.map(h => h.label);

    const songKey = (r, rank) => {
        const name = r[`第${rank}名歌名`] || '';
        const singer = r[`第${rank}名歌手`] || '';
        if (!name) return '';
        return singer ? `${singer}-${name}` : name;
    };

    const songOrder = [];
    const songSet = new Set();
    for (let rank = 1; rank <= 3; rank++) {
        const key = songKey(latest, rank);
        if (key && !songSet.has(key)) { songSet.add(key); songOrder.push(key); }
    }
    for (let i = axisHours.length - 1; i >= 0; i--) {
        const r = rowByHour[axisHours[i].key];
        if (!r) continue;
        for (let rank = 1; rank <= 3; rank++) {
            const key = songKey(r, rank);
            if (key && !songSet.has(key)) { songSet.add(key); songOrder.push(key); }
        }
    }

    const songColorMap = {};
    songOrder.forEach((key, idx) => {
        songColorMap[key] = lineColors[idx % lineColors.length];
    });

    function songSeriesData(key) {
        return axisHours.map(h => {
            const r = rowByHour[h.key];
            if (!r) return null;
            for (let rank = 1; rank <= 3; rank++) {
                if (songKey(r, rank) === key) {
                    const s = r[`第${rank}名${field}`] || '';
                    return s === '' ? null : parseFloat(s);
                }
            }
            return null;
        });
    }

    const series = songOrder.map(key => ({
        name: key,
        type: 'line',
        data: songSeriesData(key),
        smooth: false,
        symbol: 'circle',
        symbolSize: 3,
        connectNulls: false,
        itemStyle: { color: songColorMap[key] },
        lineStyle: { width: 2, color: songColorMap[key] },
        emphasis: { focus: 'series' },
    }));

    if (legendEl) {
        legendEl.innerHTML = songOrder.map(key =>
            `<span class="item"><span class="dot" style="background:${songColorMap[key]}"></span>${key}</span>`
        ).join('');
    }

    chartInst.hideLoading();
    chartInst.setOption({
        tooltip: {
            trigger: 'axis',
            confine: true,
            formatter: function(params) {
                if (!params.length) return '';
                const i = params[0].dataIndex;
                const h = axisHours[i];
                const r = rowByHour[h.key];
                let html = `<div style="font-weight:bold;margin-bottom:4px;">${h.label}${r ? '' : '（无数据）'}</div>`;
                if (r) {
                    params.forEach(p => {
                        if (p.value === null || p.value === undefined) return;
                        html += `<div>${p.marker} ${p.seriesName}：${p.value}</div>`;
                    });
                }
                return html;
            }
        },
        grid: { left: '2%', right: '5%', bottom: '12%', top: '8%', containLabel: true },
        xAxis: {
            type: 'category',
            boundaryGap: false,
            data: times,
            axisLabel: { interval: 'auto', fontSize: 10, color: '#888', rotate: 45 },
            axisLine: { lineStyle: { color: '#f0d6e4' } },
        },
        yAxis: {
            type: 'value',
            scale: true,
            interval: yInterval,
            axisLabel: { fontSize: 10, color: '#888' },
            axisLine: { lineStyle: { color: '#f0d6e4' } },
            splitLine: { lineStyle: { color: '#faf0f6' } },
        },
        series: series,
    }, true);
    chartInst.resize();
}

function loadCsv(url) {
    return new Promise((resolve) => {
        Papa.parse(url + '?t=' + new Date().getTime(), {
            download: true,
            header: true,
            skipEmptyLines: true,
            encoding: 'UTF-8',
            complete: (res) => resolve(res.data || []),
            error: (err) => {
                console.error('加载失败', url, err);
                resolve([]);
            }
        });
    });
}

(async function init() {
    const [dailyRows, weeklyRows] = await Promise.all([
        loadCsv('uni_chart_daily.csv'),
        loadCsv('uni_chart_weekly.csv'),
    ]);

    document.getElementById('loading').style.display = 'none';
    document.getElementById('content').style.display = 'block';

    renderRecentTable(dailyRows, 'dailyTableBody');
    renderChart(dailyRows, chartDaily, 'dailyLegend', '得分', 1);
    renderChart(dailyRows, chartDailyPlay, 'dailyPlayLegend', '播放热度');
    renderChart(dailyRows, chartDailySales, 'dailySalesLegend', '畅销度');
    renderChart(dailyRows, chartDailyRecommend, 'dailyRecommendLegend', '推荐度');

    renderRecentTable(weeklyRows, 'weeklyTableBody');
    renderChart(weeklyRows, chartWeekly, 'weeklyLegend', '得分', 1);
    renderChart(weeklyRows, chartWeeklyPlay, 'weeklyPlayLegend', '播放热度');
    renderChart(weeklyRows, chartWeeklySales, 'weeklySalesLegend', '畅销度');
    renderChart(weeklyRows, chartWeeklyRecommend, 'weeklyRecommendLegend', '推荐度');

    allCharts.forEach(c => c.resize());

    const allTimes = [...dailyRows, ...weeklyRows].map(r => r['时间']).filter(Boolean).sort();
    if (allTimes.length) {
        document.getElementById('updateTime').innerText = `数据最后更新：${allTimes[allTimes.length - 1]}`;
    }
})();

document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', function() {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
        this.classList.add('active');
        document.getElementById('panel-' + this.dataset.tab).classList.add('active');
        allCharts.forEach(c => c.resize());
    });
});

let resizeTimer;
window.addEventListener('resize', function() {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function() {
        allCharts.forEach(c => c.resize());
    }, 200);
});
</script>
</body>
</html>
