<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>腾讯音乐由你榜 · TOP3</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="common.css">
<script src="https://cdn.bootcdn.net/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
    html, body {
        height: 100%;
        margin: 0;
        padding: 0;
    }
    body {
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background: #faf7f9;
        font-family: sans-serif;
    }

    .container {
        flex: 0 0 auto;
        width: 100%;
        max-width: 1600px;
        margin: 0 auto;
        padding: 8px 8px 0;
        box-sizing: border-box;
    }

    .tab-bar {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin-bottom: 14px;
        flex-wrap: wrap;
    }
    .tab-btn {
        border: 1px solid rgba(234,54,144,0.35);
        background: white;
        color: #ea3690;
        font-size: 15px;
        font-weight: bold;
        padding: 8px 26px;
        border-radius: 20px;
        cursor: pointer;
        transition: all 0.2s ease;
        outline: none;
        font-family: inherit;
    }
    .tab-btn.active {
        background: #ea3690;
        color: white;
        border-color: #ea3690;
        box-shadow: 0 3px 10px rgba(234,54,144,0.25);
    }

    .frame-wrap {
        flex: 1 1 auto;
        width: 100%;
        min-height: 0;
        background: #faf7f9;
        position: relative;
    }
    iframe {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
        background: #faf7f9;
        box-sizing: border-box;
    }
</style>
</head>
<body>
<div class="container">
    <h1>腾讯音乐由你榜 · TOP3</h1>
    <div class="update-time" id="updateTime"></div>
    <div class="tab-bar">
        <button class="tab-btn active" data-src="weekly.html">周榜</button>
        <button class="tab-btn" data-src="daily.html">日榜</button>
        <button class="tab-btn" data-src="song.html">单曲追踪</button>
    </div>
</div>
<div class="frame-wrap">
    <iframe id="pageFrame" src="weekly.html" title="榜单内容"></iframe>
</div>

<script>
(function () {
    const frame = document.getElementById('pageFrame');
    const buttons = document.querySelectorAll('.tab-btn');

    buttons.forEach(btn => {
        btn.addEventListener('click', function () {
            if (this.classList.contains('active')) return;
            buttons.forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            frame.src = this.dataset.src;
        });
    });

    // 读取两个 CSV，取最大时间显示
    function loadCsvTime(url) {
        return new Promise((resolve) => {
            Papa.parse(url + '?t=' + new Date().getTime(), {
                download: true,
                header: true,
                skipEmptyLines: true,
                encoding: 'UTF-8',
                complete: (res) => {
                    const times = (res.data || [])
                        .map(r => r['时间'])
                        .filter(Boolean)
                        .sort();
                    resolve(times.length ? times[times.length - 1] : null);
                },
                error: () => resolve(null)
            });
        });
    }

    Promise.all([
        loadCsvTime('uni_chart_daily.csv'),
        loadCsvTime('uni_chart_weekly.csv'),
    ]).then(([t1, t2]) => {
        const all = [t1, t2].filter(Boolean).sort();
        if (all.length) {
            document.getElementById('updateTime').innerText =
                `数据最后更新：${all[all.length - 1]}`;
        }
    });
})();
</script>
</body>
</html>
