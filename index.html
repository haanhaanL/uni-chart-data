<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>腾讯音乐由你榜 · 前三追踪</title>
<script src="https://cdn.bootcdn.net/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
    body {
        margin: 0; padding: 8px; background-color: #faf7f9;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        display: flex; flex-direction: column; align-items: center; overflow-x: hidden;
    }
    .container { width: 100%; max-width: 1600px; }
    h1 { text-align: center; color: #ea3690; font-size: 18px; margin: 10px 0; }
    .update-time { text-align: center; color: #999; font-size: 12px; margin-bottom: 12px; }

    .charts-row { display: flex; flex-wrap: wrap; gap: 12px; width: 100%; margin-bottom: 12px; }
    .chart-col-2 { flex: 1 1 480px; min-width: 0; }
    .chart-col-3 { flex: 1 1 320px; min-width: 0; }

    .card {
        background: white; border-radius: 12px; box-shadow: 0 4px 12px rgba(234,54,144,0.08);
        padding: 12px 0; overflow: hidden; border: 1px solid rgba(234,54,144,0.10);
    }
    .title { text-align: center; color: #ea3690; font-size: 15px; font-weight: bold; margin: 5px 0 8px 0; }
    .chart-legend-text {
        text-align: center; font-size: 12px; color: #666;
        margin: 0 8px 6px 8px; line-height: 1.8;
    }
    .chart-legend-text .item { display: inline-block; margin: 0 5px; }
    .chart-legend-text .dot {
        display: inline-block; width: 8px; height: 8px; border-radius: 50%;
        margin-right: 4px; vertical-align: middle;
    }
    .chart-wrapper { width: 100%; height: 350px; }
    .chart-wrapper-sm { width: 100%; height: 300px; }
    #loading { text-align: center; color: #999; font-size: 16px; margin-top: 50px; }
</style>
</head>
<body>
<div class="container">
    <h1>腾讯音乐由你榜 · 日榜/周榜前三</h1>
    <div class="update-time" id="updateTime"></div>
    <div id="loading">正在加载数据...</div>
    <div id="content" style="display:none;">

        <!-- 第一行：日榜/周榜 得分趋势 -->
        <div class="charts-row">
            <div class="chart-col-2">
                <div class="card">
                    <div class="title">📅 日榜前三得分趋势</div>
                    <div class="chart-legend-text" id="dailyLegend"></div>
                    <div class="chart-wrapper" id="chartDaily"></div>
                </div>
            </div>
            <div class="chart-col-2">
                <div class="card">
                    <div class="title">📆 周榜前三得分趋势</div>
                    <div class="chart-legend-text" id="weeklyLegend"></div>
                    <div class="chart-wrapper" id="chartWeekly"></div>
                </div>
            </div>
        </div>

        <!-- 第二行：日榜三个维度，一行三个 -->
        <div class="charts-row">
            <div class="chart-col-3">
                <div class="card">
                    <div class="title">📅 日榜 · 播放热度</div>
                    <div class="chart-legend-text" id="dailyPlayLegend"></div>
                    <div class="chart-wrapper-sm" id="chartDailyPlay"></div>
                </div>
            </div>
            <div class="chart-col-3">
                <div class="card">
                    <div class="title">📅 日榜 · 畅销度</div>
                    <div class="chart-legend-text" id="dailySalesLegend"></div>
                    <div class="chart-wrapper-sm" id="chartDailySales"></div>
                </div>
            </div>
            <div class="chart-col-3">
                <div class="card">
                    <div class="title">📅 日榜 · 推荐度</div>
                    <div class="chart-legend-text" id="dailyRecommendLegend"></div>
                    <div class="chart-wrapper-sm" id="chartDailyRecommend"></div>
                </div>
            </div>
        </div>

        <!-- 第三行：周榜三个维度，一行三个 -->
        <div class="charts-row">
            <div class="chart-col-3">
                <div class="card">
                    <div class="title">📆 周榜 · 播放热度</div>
                    <div class="chart-legend-text" id="weeklyPlayLegend"></div>
                    <div class="chart-wrapper-sm" id="chartWeeklyPlay"></div>
                </div>
            </div>
            <div class="chart-col-3">
                <div class="card">
                    <div class="title">📆 周榜 · 畅销度</div>
                    <div class="chart-legend-text" id="weeklySalesLegend"></div>
                    <div class="chart-wrapper-sm" id="chartWeeklySales"></div>
                </div>
            </div>
            <div class="chart-col-3">
                <div class="card">
                    <div class="title">📆 周榜 · 推荐度</div>
                    <div class="chart-legend-text" id="weeklyRecommendLegend"></div>
                    <div class="chart-wrapper-sm" id="chartWeeklyRecommend"></div>
                </div>
            </div>
        </div>

    </div>
</div>

<script>
// 三条线颜色：粉 / 紫 / 橙
const lineColors = ['#ea3690', '#7c3aed', '#e74c3c'];

const chartDaily = echarts.init(document.getElementById('chartDaily'));
const chartWeekly = echarts.init(document.getElementById('chartWeekly'));
const chartDailyPlay = echarts.init(document.getElementById('chartDailyPlay'));
const chartDailySales = echarts.init(document.getElementById('chartDailySales'));
const chartDailyRecommend = echarts.init(document.getElementById('chartDailyRecommend'));
const chartWeeklyPlay = echarts.init(document.getElementById('chartWeeklyPlay'));
const chartWeeklySales = echarts.init(document.getElementById('chartWeeklySales'));
const chartWeeklyRecommend = echarts.init(document.getElementById('chartWeeklyRecommend'));

const allCharts = [chartDaily, chartWeekly, chartDailyPlay, chartDailySales,
                   chartDailyRecommend, chartWeeklyPlay, chartWeeklySales, chartWeeklyRecommend];
allCharts.forEach(c => c.showLoading());

function renderChart(rows, chartInst, legendId, field, yName) {
    const legendEl = document.getElementById(legendId);
    if (!rows.length) {
        chartInst.hideLoading();
        chartInst.setOption({
            title: { text: '暂无数据', left: 'center', top: 'middle', textStyle: { color: '#999', fontSize: 14 } }
        }, true);
        if (legendEl) legendEl.innerHTML = '';
        return;
    }

    const sorted = [...rows].sort((a, b) => (a['时间'] || '').localeCompare(b['时间'] || ''));
    const times = sorted.map(r => {
        const t = r['时间'] || '';
        const p = t.split(' ');
        return p.length > 1 ? p[1] : t;
    });
    const latest = sorted[sorted.length - 1];

    function legendText(rank) {
        const name = latest[`第${rank}名歌名`] || '';
        const singer = latest[`第${rank}名歌手`] || '';
        if (!name) return `第${rank}名`;
        return singer ? `${singer} - ${name}` : name;
    }

    function seriesData(rank) {
        return sorted.map(r => {
            const s = r[`第${rank}名${field}`] || '';
            return s === '' ? null : parseFloat(s);
        });
    }

    const series = [1, 2, 3].map((rank, idx) => ({
        name: `第${rank}名`,
        type: 'line',
        data: seriesData(rank),
        smooth: false,
        symbol: 'circle',
        symbolSize: 3,
        connectNulls: false,
        itemStyle: { color: lineColors[idx] },
        lineStyle: { width: 2, color: lineColors[idx] },
        emphasis: { focus: 'series' },
    }));

    if (legendEl) {
        const marks = ['①', '②', '③'];
        legendEl.innerHTML = [1, 2, 3].map((rank, idx) =>
            `<span class="item"><span class="dot" style="background:${lineColors[idx]}"></span>${marks[idx]}${legendText(rank)}</span>`
        ).join('');
    }

    chartInst.hideLoading();
    chartInst.setOption({
        color: lineColors,
        tooltip: {
            trigger: 'axis',
            confine: true,
            formatter: function(params) {
                if (!params.length) return '';
                const i = params[0].dataIndex;
                let html = `<div style="font-weight:bold;margin-bottom:4px;">${sorted[i]['时间']}</div>`;
                params.forEach(p => {
                    const rank = p.seriesIndex + 1;
                    const name = sorted[i][`第${rank}名歌名`] || '';
                    const singer = sorted[i][`第${rank}名歌手`] || '';
                    const val = sorted[i][`第${rank}名${field}`] || '';
                    html += `<div>${p.marker} 第${rank}名：${singer ? singer + ' - ' : ''}${name} <b>${val}</b></div>`;
                });
                return html;
            }
        },
        grid: { left: '2%', right: '5%', bottom: '12%', top: '8%', containLabel: true },
        xAxis: {
            type: 'category',
            boundaryGap: false,
            data: times,
            axisLabel: { interval: 'auto', fontSize: 10, color: '#888', rotate: 45 },
            axisLine: { lineStyle: { color: '#f0d6e4' } },
        },
        yAxis: {
            type: 'value',
            name: yName,
            nameTextStyle: { color: '#999', fontSize: 11 },
            scale: true,
            axisLabel: { fontSize: 10, color: '#888' },
            axisLine: { lineStyle: { color: '#f0d6e4' } },
            splitLine: { lineStyle: { color: '#faf0f6' } },
        },
        series: series,
    }, true);
}

Papa.parse('uni_chart_data.csv?t=' + new Date().getTime(), {
    download: true,
    header: true,
    skipEmptyLines: true,
    encoding: 'UTF-8',
    complete: function(results) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('content').style.display = 'block';

        const data = results.data || [];
        const dailyRows = data.filter(r => r['榜单类型'] === '日榜');
        const weeklyRows = data.filter(r => r['榜单类型'] === '周榜');

        // 得分趋势
        renderChart(dailyRows, chartDaily, 'dailyLegend', '得分', '得分');
        renderChart(weeklyRows, chartWeekly, 'weeklyLegend', '得分', '得分');

        // 日榜三个维度
        renderChart(dailyRows, chartDailyPlay, 'dailyPlayLegend', '播放热度', '播放热度');
        renderChart(dailyRows, chartDailySales, 'dailySalesLegend', '畅销度', '畅销度');
        renderChart(dailyRows, chartDailyRecommend, 'dailyRecommendLegend', '推荐度', '推荐度');

        // 周榜三个维度
        renderChart(weeklyRows, chartWeeklyPlay, 'weeklyPlayLegend', '播放热度', '播放热度');
        renderChart(weeklyRows, chartWeeklySales, 'weeklySalesLegend', '畅销度', '畅销度');
        renderChart(weeklyRows, chartWeeklyRecommend, 'weeklyRecommendLegend', '推荐度', '推荐度');

        allCharts.forEach(c => c.resize());

        const allTimes = data.map(r => r['时间']).filter(Boolean).sort();
        if (allTimes.length) {
            document.getElementById('updateTime').innerText = `数据最后更新：${allTimes[allTimes.length - 1]}`;
        }
    },
    error: function(err) {
        document.getElementById('loading').innerText = '加载 uni_chart_data.csv 失败，请确认文件在同目录下。';
        console.error(err);
    }
});

let resizeTimer;
window.addEventListener('resize', function() {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function() {
        allCharts.forEach(c => c.resize());
    }, 200);
});
</script>
</body>
</html>
