<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>腾讯音乐由你榜 · 前三追踪</title>
<script src="https://cdn.bootcdn.net/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
    body {
        margin: 0; padding: 8px; background-color: #faf7f9;
        font-family: sans-serif;
        display: flex; flex-direction: column; align-items: center; overflow-x: hidden;
    }
    .container { width: 100%; max-width: 1600px; }
    h1 { text-align: center; color: #ea3690; font-size: 18px; margin: 10px 0; }
    .update-time { text-align: center; color: #999; font-size: 12px; margin-bottom: 12px; }

    .tab-bar { display: flex; justify-content: center; gap: 10px; margin-bottom: 14px; }
    .tab-btn {
        border: 1px solid rgba(234,54,144,0.35); background: white; color: #ea3690;
        font-size: 15px; font-weight: bold; padding: 8px 26px; border-radius: 20px;
        cursor: pointer; transition: all 0.2s ease; outline: none;
        font-family: inherit;
    }
    .tab-btn.active {
        background: #ea3690; color: white; border-color: #ea3690;
        box-shadow: 0 3px 10px rgba(234,54,144,0.25);
    }
    .tab-panel { display: none; width: 100%; }
    .tab-panel.active { display: block; }

    .charts-row { display: flex; flex-wrap: wrap; gap: 12px; width: 100%; margin-bottom: 12px; }
    .chart-col-1 { flex: 1 1 100%; min-width: 0; }
    .chart-col-3 { flex: 1 1 320px; min-width: 0; }

    .score-row {
        display: flex; flex-wrap: wrap; gap: 12px; width: 100%;
        margin-bottom: 12px; align-items: flex-start;
    }
    .score-table-col {
        flex: 2 1 0;
        min-width: 280px;
        max-width: 100%;
        display: flex; flex-direction: column;
    }
    .score-chart-col {
        flex: 1 1 0;
        min-width: 0;
    }

    .card {
        background: white; border-radius: 12px; box-shadow: 0 4px 12px rgba(234,54,144,0.08);
        padding: 12px 0; overflow: hidden; border: 1px solid rgba(234,54,144,0.10);
    }
    .title { text-align: center; color: #ea3690; font-size: 15px; font-weight: bold; margin: 5px 0 8px 0; }
    .chart-legend-text {
        text-align: center; font-size: 12px; color: #666; margin: 0 8px 6px 8px; line-height: 1.8;
    }
    .chart-legend-text .item { display: inline-block; margin: 0 5px; }
    .chart-legend-text .dot {
        display: inline-block; width: 8px; height: 8px; border-radius: 50%;
        margin-right: 4px; vertical-align: middle;
    }
    .chart-wrapper { width: 100%; height: 300px; }

    .score-table-col .card {
        height: 520px;
        display: flex; flex-direction: column;
        overflow: hidden;
    }
    .score-chart-col .card {
        height: 520px;
        display: flex; flex-direction: column;
    }
    .chart-wrapper-flex {
        width: 100%;
        flex: 1 1 auto;
        min-height: 0;
    }

    .table-scroll-box {
        width: 100%;
        overflow-x: auto; overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        flex: 1 1 auto; min-height: 0;
        display: flex; flex-direction: column;
    }
    .table-scroll-box::-webkit-scrollbar { display: none; }

    .recent-table {
        width: 100%;
        height: 100%;
        border-collapse: separate;
        border-spacing: 0;
        font-size: 12px;
        table-layout: fixed;
        min-width: 720px;
    }
    .recent-table th, .recent-table td {
        padding: 8px 5px; text-align: center; border-bottom: 1px solid #f3e6ee; white-space: nowrap;
        min-height: 36px; line-height: 1.5;
    }
    .recent-table th {
        background-color: #ea3690 !important;
        color: #ffffff;
        font-weight: bold;
        font-size: 11px;
        position: sticky;
        top: 0;
        z-index: 2;
        border: 1px solid rgba(255, 255, 255, 0.3);
        box-shadow: 0 1px 0 #f3e6ee;
    }
    /* 只固定表头第一行第一列（时间） */
    .recent-table thead tr:first-child th:first-child {
        position: sticky !important;
        top: 0 !important;
        left: 0 !important;
        z-index: 20 !important;
        background-color: #ea3690 !important;
        color: #ffffff !important;
        border: 1px solid rgba(255, 255, 255, 0.3);
    }
    .recent-table td:first-child {
        position: sticky;
        left: 0;
        z-index: 1;
        color: #555;
        background-color: #ffffff;
    }
    .recent-table tbody tr:nth-child(even) td:first-child {
        background-color: #fdf7fa;
    }
    .recent-table tbody tr:nth-child(even) {
        background-color: #ea36900a;
    }
    .recent-table .song-cell {
        max-width: 130px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        text-align: left;
        color: #555;
    }
    .val-score { font-weight: bold; color: #333; }
    .up { color: #e74c3c; font-weight: bold; }
    .flat, .down { color: #999; font-weight: bold; }

    #loading { text-align: center; color: #999; font-size: 16px; margin-top: 50px; }

    .range-tabs {
        display: flex; justify-content: center; gap: 8px; margin: 2px 0 6px 0;
    }
    .range-btn {
        border: 1px solid rgba(234,54,144,0.35);
        background: white; color: #ea3690;
        font-size: 12px; padding: 3px 12px; border-radius: 12px;
        cursor: pointer; outline: none; font-family: inherit;
    }
    .range-btn.active {
        background: #ea3690; color: #fff; border-color: #ea3690;
    }

    @media (max-width: 900px) {
        .score-row { flex-direction: column; align-items: stretch; }
        .score-table-col, .score-chart-col {
            flex: 1 1 100%; width: 100%; min-width: 0; max-width: 100%;
        }
        .score-table-col .card, .score-chart-col .card {
            height: auto; min-height: 0;
        }
        .score-table-col .card { max-height: 420px; overflow: hidden; }
        .chart-wrapper-flex { height: 280px; flex: none; }

        .table-scroll-box { overflow-x: auto; overflow-y: auto; }
        .recent-table { min-width: 720px; font-size: 11px; }
        .recent-table th, .recent-table td { padding: 6px 4px; }
        .recent-table .song-cell { max-width: 150px; }
    }
</style>
</head>
<body>

<script>
// 循环配色（与你 style 里的实际颜色一致）
const lineColors = ['#ea3690', '#7c3aed', '#00e268', '#f5cc0b', '#10b981', '#c4b5fd', '#ef4444', '#14b8a6', '#f97316', '#64748b'];

// TOP 图四项固定色
const rankFields = [
    { key: '得分',     color: '#ea3690' },
    { key: '播放热度', color: '#7c3aed' },
    { key: '畅销度',   color: '#00e268' },
    { key: '推荐度',   color: '#f5cc0b' },
];

const chartDaily = echarts.init(document.getElementById('chartDaily'));
const chartWeekly = echarts.init(document.getElementById('chartWeekly'));
const chartDailyPlay = echarts.init(document.getElementById('chartDailyPlay'));
const chartDailySales = echarts.init(document.getElementById('chartDailySales'));
const chartDailyRecommend = echarts.init(document.getElementById('chartDailyRecommend'));
const chartWeeklyPlay = echarts.init(document.getElementById('chartWeeklyPlay'));
const chartWeeklySales = echarts.init(document.getElementById('chartWeeklySales'));
const chartWeeklyRecommend = echarts.init(document.getElementById('chartWeeklyRecommend'));

const chartWeeklyRank1 = echarts.init(document.getElementById('chartWeeklyRank1'));
const chartWeeklyRank2 = echarts.init(document.getElementById('chartWeeklyRank2'));
const chartWeeklyRank3 = echarts.init(document.getElementById('chartWeeklyRank3'));
const chartDailyRank1 = echarts.init(document.getElementById('chartDailyRank1'));
const chartDailyRank2 = echarts.init(document.getElementById('chartDailyRank2'));
const chartDailyRank3 = echarts.init(document.getElementById('chartDailyRank3'));

const allCharts = [chartDaily, chartWeekly, chartDailyPlay, chartDailySales,
                   chartDailyRecommend, chartWeeklyPlay, chartWeeklySales, chartWeeklyRecommend,
                   chartWeeklyRank1, chartWeeklyRank2, chartWeeklyRank3,
                   chartDailyRank1, chartDailyRank2, chartDailyRank3];
allCharts.forEach(c => c.showLoading());

function colorClass(v) {
    if (v === undefined || v === null || v === '') return '';
    const fv = parseFloat(v);
    if (isNaN(fv)) return '';
    return fv > 0 ? 'up' : 'flat';
}

function stripYear(timeStr) {
    if (!timeStr) return '';
    return timeStr.replace(/^\d{4}[-/]/, '');
}

function parseTime(s) {
    const m = (s || '').match(/(\d{4})[-/](\d{1,2})[-/](\d{1,2})(?:[ T](\d{1,2}):(\d{1,2})(?::(\d{1,2}))?)?/);
    if (!m) return null;
    return new Date(
        parseInt(m[1]), parseInt(m[2]) - 1, parseInt(m[3]),
        m[4] ? parseInt(m[4]) : 0,
        m[5] ? parseInt(m[5]) : 0,
        m[6] ? parseInt(m[6]) : 0
    );
}

// 日榜“当日”日期：每天 0:10 前仍算前一天
function getTodayDateForDaily() {
    const now = new Date();
    const effective = new Date(now);
    if (now.getHours() === 0 && now.getMinutes() < 10) {
        effective.setDate(effective.getDate() - 1);
    }
    return effective;
}

function fmtDateLabel(d) {
    return `${d.getMonth() + 1}月${d.getDate()}日`;
}

function fmtDateKey(d) {
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

function refreshDailyDateButtons() {
    const label = fmtDateLabel(getTodayDateForDaily());
    document.querySelectorAll('.range-tabs[data-chart^="daily"] .range-btn[data-range="today"]').forEach(btn => {
        btn.textContent = label;
    });
}

function renderRecentTable(rows, tbodyId) {
    const tbody = document.getElementById(tbodyId);
    if (!rows.length) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:#999;">暂无数据</td></tr>';
        return;
    }
    const sorted = [...rows].sort((a, b) => (b['时间'] || '').localeCompare(a['时间'] || ''));
    const recent = sorted.slice(0, 10);
    tbody.innerHTML = recent.map(r => {
        const displayTime = stripYear(r['时间'] || '');
        const cells = [`<td>${displayTime}</td>`];
        for (let i = 1; i <= 3; i++) {
            const name = r[`第${i}名歌名`] || '';
            const singer = r[`第${i}名歌手`] || '';
            const song = singer ? `${name}-${singer}` : name;
            const score = r[`第${i}名得分`] || '';
            const change = r[`第${i}名官方增幅`] || '';
            const changeText = change === '' ? '' : '+' + change;
            const cls = colorClass(change);
            cells.push(`<td class="song-cell" title="${song}">${song}</td>`);
            cells.push(`<td><span class="val-score">${score}</span> / <span class="${cls}">${changeText}</span></td>`);
        }
        return `<tr>${cells.join('')}</tr>`;
    }).join('');
}

// 生成时间轴/列数据
function buildAxis(rows, range) {
    const allSorted = [...rows].sort((a, b) => (a['时间'] || '').localeCompare(b['时间'] || ''));
    const now = new Date();
    let rowsByColumn = [];
    let times = [];

    if (range === '3') {
        const cutoff = now.getTime() - 3 * 60 * 60 * 1000;
        const inRange = allSorted.filter(r => {
            const t = parseTime(r['时间']);
            return t && t.getTime() >= cutoff;
        });
        rowsByColumn = inRange;
        times = inRange.map(r => {
            const t = r['时间'] || '';
            const p = t.split(' ');
            return p.length > 1 ? p[1] : t;
        });
    } else if (range === '24') {
        const byMin06 = {};
        allSorted.forEach(r => {
            const t = parseTime(r['时间']);
            if (!t || t.getMinutes() !== 6) return;
            const key = `${fmtDateKey(t)} ${String(t.getHours()).padStart(2, '0')}:06`;
            byMin06[key] = r;
        });
        for (let i = 23; i >= 0; i--) {
            const d = new Date(now.getTime() - i * 60 * 60 * 1000);
            const key = `${fmtDateKey(d)} ${String(d.getHours()).padStart(2, '0')}:06`;
            rowsByColumn.push(byMin06[key] || null);
            times.push(`${String(d.getHours()).padStart(2, '0')}:06`);
        }
    } else {
        const baseDay = getTodayDateForDaily();
        const nextDay = new Date(baseDay);
        nextDay.setDate(nextDay.getDate() + 1);
        const rowByKey = {};
        allSorted.forEach(r => {
            const t = parseTime(r['时间']);
            if (!t) return;
            const key = `${fmtDateKey(t)} ${String(t.getHours()).padStart(2, '0')}:${String(t.getMinutes()).padStart(2, '0')}`;
            rowByKey[key] = r;
        });
        const key00 = `${fmtDateKey(baseDay)} 00:16`;
        rowsByColumn.push(rowByKey[key00] || null);
        times.push('00:06');
        for (let h = 1; h <= 23; h++) {
            const key = `${fmtDateKey(baseDay)} ${String(h).padStart(2, '0')}:06`;
            rowsByColumn.push(rowByKey[key] || null);
            times.push(`${String(h).padStart(2, '0')}:06`);
        }
        const key24 = `${fmtDateKey(nextDay)} 00:06`;
        rowsByColumn.push(rowByKey[key24] || null);
        times.push('24:00');
    }

    return { rowsByColumn, times };
}

function renderChart(rows, chartInst, legendId, field, yInterval, range, mode) {
    range = range || '3';
    const legendEl = document.getElementById(legendId);
    const { rowsByColumn, times } = buildAxis(rows, range);

    let latest = null;
    for (let i = rowsByColumn.length - 1; i >= 0; i--) {
        if (rowsByColumn[i]) { latest = rowsByColumn[i]; break; }
    }

    if (!latest) {
        chartInst.hideLoading();
        chartInst.setOption({
            title: { text: '暂无数据', left: 'center', top: 'middle', textStyle: { color: '#999', fontSize: 14 } }
        }, true);
        if (legendEl) legendEl.innerHTML = '';
        return;
    }

    const songKey = (r, rank) => {
        const name = r[`第${rank}名歌名`] || '';
        const singer = r[`第${rank}名歌手`] || '';
        if (!name) return '';
        return singer ? `${singer}-${name}` : name;
    };

    const songOrder = [];
    const songSet = new Set();
    for (let rank = 1; rank <= 3; rank++) {
        const key = songKey(latest, rank);
        if (key && !songSet.has(key)) { songSet.add(key); songOrder.push(key); }
    }
    for (let i = rowsByColumn.length - 1; i >= 0; i--) {
        const r = rowsByColumn[i];
        if (!r) continue;
        for (let rank = 1; rank <= 3; rank++) {
            const key = songKey(r, rank);
            if (key && !songSet.has(key)) { songSet.add(key); songOrder.push(key); }
        }
    }

    const songColorMap = {};
    songOrder.forEach((key, idx) => {
        songColorMap[key] = lineColors[idx % lineColors.length];
    });

    function songSeriesData(key) {
        return rowsByColumn.map(r => {
            if (!r) return null;
            for (let rank = 1; rank <= 3; rank++) {
                if (songKey(r, rank) === key) {
                    const s = r[`第${rank}名${field}`] || '';
                    return s === '' ? null : parseFloat(s);
                }
            }
            return null;
        });
    }

    const series = songOrder.map(key => ({
        name: key,
        type: 'line',
        data: songSeriesData(key),
        smooth: false,
        symbol: 'circle',
        symbolSize: 3,
        connectNulls: false,
        itemStyle: { color: songColorMap[key] },
        lineStyle: { width: 2, color: songColorMap[key] },
        emphasis: { focus: 'series' },
    }));

    if (legendEl) {
        legendEl.innerHTML = songOrder.map(key =>
            `<span class="item"><span class="dot" style="background:${songColorMap[key]}"></span>${key}</span>`
        ).join('');
    }

    chartInst.hideLoading();
    chartInst.setOption({
        tooltip: {
            trigger: 'axis',
            confine: true,
            formatter: function(params) {
                if (!params.length) return '';
                const i = params[0].dataIndex;
                const r = rowsByColumn[i];
                const label = range === '3'
                    ? (r && r['时间']) || times[i]
                    : times[i] + (r ? '' : '（无数据）');
                let html = `<div style="font-weight:bold;margin-bottom:4px;">${label}</div>`;
                if (r) {
                    params.forEach(p => {
                        if (p.value === null || p.value === undefined) return;

                        let deltaRaw = '';
                        for (let rank = 1; rank <= 3; rank++) {
                            if (songKey(r, rank) === p.seriesName) {
                                deltaRaw = r[`第${rank}名官方增幅`] || '';
                                break;
                            }
                        }

                        let text = '';
                        let color = '#999';
                        if (deltaRaw !== '') {
                            const fv = parseFloat(deltaRaw);
                            text = (fv > 0 ? '+' : '') + deltaRaw;
                            color = fv > 0 ? '#ea3690' : '#999';
                        }

                        html += `<div style="display:flex;align-items:center;gap:2px;min-width:150px;">`
                              + `<span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${p.marker} ${p.seriesName}</span>`
                              + `<span style="width:48px;text-align:right;white-space:nowrap;">${p.value}</span>`
                              + `<span style="width:48px;text-align:right;white-space:nowrap;color:${color};">${text}</span>`
                              + `</div>`;
                    });
                }
                return html;
            }
        },
        grid: { left: '2%', right: '5%', bottom: '12%', top: '8%', containLabel: true },
        xAxis: {
            type: 'category',
            boundaryGap: false,
            data: times,
            axisLabel: {
                interval: range === '3' ? 'auto' : 1,
                fontSize: 10,
                color: '#888',
                rotate: 45,
            },
            axisLine: { lineStyle: { color: '#f0d6e4' } },
        },
        yAxis: {
            type: 'value',
            scale: true,
            interval: yInterval,
            axisLabel: { fontSize: 10, color: '#888' },
            axisLine: { lineStyle: { color: '#f0d6e4' } },
            splitLine: { lineStyle: { color: '#faf0f6' } },
        },
        series: series,
    }, true);
    chartInst.resize();
}
