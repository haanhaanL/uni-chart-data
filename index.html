<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>腾讯音乐由你榜 · TOP3追踪</title>
<script src="https://cdn.bootcdn.net/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
    body {
        margin: 0; padding: 8px; background-color: #faf7f9;
        font-family: sans-serif;
        display: flex; flex-direction: column; align-items: center; overflow-x: hidden;
    }
    body::after {
        content: ""; position: fixed; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; z-index: 99998;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='120'><text x='20' y='70' font-size='28' font-weight='900' fill='rgba(234,54,144,0.06)' transform='rotate(-25 100 60)'>mzc051</text></svg>");
        background-repeat: repeat; background-size: 200px 120px;
    }
    .container { width: 100%; max-width: 1600px; }
    h1 { text-align: center; color: #ea3690; font-size: 18px; margin: 10px 0; }
    .update-time { text-align: center; color: #999; font-size: 12px; margin-bottom: 12px; }

    .tab-bar { display: flex; justify-content: center; gap: 10px; margin-bottom: 14px; }
    .tab-btn {
        border: 1px solid rgba(234,54,144,0.35); background: white; color: #ea3690;
        font-size: 15px; font-weight: bold; padding: 8px 26px; border-radius: 20px;
        cursor: pointer; transition: all 0.2s ease; outline: none;
        font-family: inherit;
    }
    .tab-btn.active {
        background: #ea3690; color: white; border-color: #ea3690;
        box-shadow: 0 3px 10px rgba(234,54,144,0.25);
    }
    .tab-panel { display: none; width: 100%; }
    .tab-panel.active { display: block; }

    .charts-row { display: flex; flex-wrap: wrap; gap: 12px; width: 100%; margin-bottom: 12px; }
    .chart-col-1 { flex: 1 1 100%; min-width: 0; }
    .chart-col-3 { flex: 1 1 320px; min-width: 0; }

    .score-row {
        display: flex; flex-wrap: wrap; gap: 12px; width: 100%;
        margin-bottom: 12px; align-items: flex-start;
    }
    .score-table-col {
        flex: 2 1 0;
        min-width: 280px;
        max-width: 100%;
        display: flex; flex-direction: column;
    }
    .score-chart-col {
        flex: 1 1 0;
        min-width: 0;
    }

    .card {
        background: white; border-radius: 12px; box-shadow: 0 4px 12px rgba(234,54,144,0.08);
        padding: 12px 0; overflow: hidden; border: 1px solid rgba(234,54,144,0.10);
    }
    .title { text-align: center; color: #ea3690; font-size: 15px; font-weight: bold; margin: 5px 0 8px 0; }
    .chart-legend-text {
        text-align: center; font-size: 12px; color: #666; margin: 0 8px 6px 8px; line-height: 1.8;
    }
    .chart-legend-text .item { display: inline-block; margin: 0 5px; }
    .chart-legend-text .dot {
        display: inline-block; width: 8px; height: 8px; border-radius: 50%;
        margin-right: 4px; vertical-align: middle;
    }
    .chart-wrapper { width: 100%; height: 300px; }

    .score-table-col .card {
        height: 520px;
        display: flex; flex-direction: column;
        overflow: hidden;
    }
    .score-chart-col .card {
        height: 520px;
        display: flex; flex-direction: column;
    }
    .chart-wrapper-flex {
        width: 100%;
        flex: 1 1 auto;
        min-height: 0;
    }

    .table-scroll-box {
        width: 100%;
        overflow-x: auto; overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        flex: 1 1 auto; min-height: 0;
        display: flex; flex-direction: column;
    }
    .table-scroll-box::-webkit-scrollbar { display: none; }

    .recent-table {
        width: 100%;
        height: 100%;
        border-collapse: separate;
        border-spacing: 0;
        font-size: 12px;
        table-layout: fixed;
        min-width: 720px;
    }
    .recent-table th, .recent-table td {
        padding: 8px 5px; text-align: center; border-bottom: 1px solid #f3e6ee; white-space: nowrap;
        min-height: 36px; line-height: 1.5;
    }
    .recent-table th {
        background-color: #ea3690 !important;
        color: #ffffff;
        font-weight: bold;
        font-size: 11px;
        position: sticky;
        top: 0;
        z-index: 2;
        border: 1px solid rgba(255, 255, 255, 0.3);
        box-shadow: 0 1px 0 #f3e6ee;
    }
    .recent-table thead tr:first-child th:first-child {
        position: sticky !important;
        top: 0 !important;
        left: 0 !important;
        z-index: 20 !important;
        background-color: #ea3690 !important;
        color: #ffffff !important;
        border: 1px solid rgba(255, 255, 255, 0.3);
    }
    .recent-table td:first-child {
        position: sticky;
        left: 0;
        z-index: 1;
        color: #555;
        background-color: #ffffff;
    }
    .recent-table tbody tr:nth-child(even) td:first-child {
        background-color: #fdf7fa;
    }
    .recent-table tbody tr:nth-child(even) {
        background-color: #ea36900a;
    }
    .recent-table tbody tr.placeholder-row {
        background-color: transparent !important;
    }
    .recent-table tbody tr.placeholder-row td {
        border-bottom-color: transparent;
    }
    .recent-table tbody tr.placeholder-row td:first-child {
        background-color: #ffffff !important;
    }
    .recent-table .song-cell {
        max-width: 130px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        text-align: left;
        color: #555;
    }
    .val-score { font-weight: bold; color: #333; }
    .up { color: #e74c3c; font-weight: bold; }
    .flat, .down { color: #999; font-weight: bold; }

    #loading { text-align: center; color: #999; font-size: 16px; margin-top: 50px; }

    .range-tabs {
        display: flex; justify-content: center; gap: 8px; margin: 2px 0 6px 0;
    }
    .range-btn {
        border: 1px solid rgba(234,54,144,0.35);
        background: white; color: #ea3690;
        font-size: 12px; padding: 3px 12px; border-radius: 12px;
        cursor: pointer; outline: none; font-family: inherit;
    }
    .range-btn.active {
        background: #ea3690; color: #fff; border-color: #ea3690;
    }

    .range-hint {
        text-align: center;
        font-size: 11px;
        color: #bbb;
        margin: 0 8px 4px 8px;
    }

    @media (max-width: 900px) {
        .score-row { flex-direction: column; align-items: stretch; }
        .score-table-col, .score-chart-col {
            flex: 1 1 100%; width: 100%; min-width: 0; max-width: 100%;
        }
        .score-table-col .card, .score-chart-col .card {
            height: auto; min-height: 0;
        }
        .score-table-col .card { max-height: 420px; overflow: hidden; }
        .chart-wrapper-flex { height: 280px; flex: none; }

        .table-scroll-box { overflow-x: auto; overflow-y: auto; }
        .recent-table { min-width: 720px; font-size: 11px; }
        .recent-table th, .recent-table td { padding: 6px 4px; }
        .recent-table .song-cell { max-width: 150px; }
    }
</style>
</head>
<body>
<div class="container">
    <h1>腾讯音乐由你榜 · TOP3</h1>
    <div class="update-time" id="updateTime"></div>
    <div id="loading">正在加载数据...</div>

    <div id="content" style="display:none;">
        <div class="tab-bar">
            <button class="tab-btn active" data-tab="weekly">周榜</button>
            <button class="tab-btn" data-tab="daily">日榜</button>
        </div>

        <!-- ================= 周榜 ================= -->
        <div class="tab-panel active" id="panel-weekly">
            <div class="range-hint" style="margin-bottom:8px;">
                每日数据按次日0:06算，当日按最新显示
            </div>
            <div class="score-row">
                <div class="score-table-col">
                    <div class="card">
                        <div class="title">周榜 · 最近10条</div>
                        <div class="table-scroll-box">
                            <table class="recent-table">
                                <colgroup>
                                    <col style="width: 14%;">
                                    <col style="width: 18%;"><col style="width: 12%;">
                                    <col style="width: 18%;"><col style="width: 12%;">
                                    <col style="width: 18%;"><col style="width: 12%;">
                                </colgroup>
                                <thead>
                                    <tr>
                                        <th rowspan="2">时间</th>
                                        <th colspan="2">1</th>
                                        <th colspan="2">2</th>
                                        <th colspan="2">3</th>
                                    </tr>
                                    <tr>
                                        <th>歌名-歌手</th><th>总分 / 增幅</th>
                                        <th>歌名-歌手</th><th>总分 / 增幅</th>
                                        <th>歌名-歌手</th><th>总分 / 增幅</th>
                                    </tr>
                                </thead>
                                <tbody id="weeklyTableBody"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
                <div class="score-chart-col">
                    <div class="card">
                        <div class="title">周榜 · 总分</div>
                        <div class="range-tabs" data-chart="weeklyScore">
                            <button class="range-btn active" data-range="3d">最近三天</button>
                            <button class="range-btn" data-range="10d">最近十天</button>
                        </div>
                        <div class="chart-legend-text" id="weeklyLegend"></div>
                        <div class="chart-wrapper-flex" id="chartWeekly"></div>
                    </div>
                </div>
            </div>

            <!-- TOP1/2/3 -->
            <div class="charts-row">
                <div class="chart-col-3">
                    <div class="card">
                        <div class="title">周榜 · TOP1</div>
                        <div class="range-tabs" data-chart="weeklyRank1">
                            <button class="range-btn active" data-range="3d">最近三天</button>
                            <button class="range-btn" data-range="10d">最近十天</button>
                        </div>
                        <div class="chart-legend-text" id="weeklyRank1Legend"></div>
                        <div class="chart-wrapper" id="chartWeeklyRank1"></div>
                    </div>
                </div>
                <div class="chart-col-3">
                    <div class="card">
                        <div class="title">周榜 · TOP2</div>
                        <div class="range-tabs" data-chart="weeklyRank2">
                            <button class="range-btn active" data-range="3d">最近三天</button>
                            <button class="range-btn" data-range="10d">最近十天</button>
                        </div>
                        <div class="chart-legend-text" id="weeklyRank2Legend"></div>
                        <div class="chart-wrapper" id="chartWeeklyRank2"></div>
                    </div>
                </div>
                <div class="chart-col-3">
                    <div class="card">
                        <div class="title">周榜 · TOP3</div>
                        <div class="range-tabs" data-chart="weeklyRank3">
                            <button class="range-btn active" data-range="3d">最近三天</button>
                            <button class="range-btn" data-range="10d">最近十天</button>
                        </div>
                        <div class="chart-legend-text" id="weeklyRank3Legend"></div>
                        <div class="chart-wrapper" id="chartWeeklyRank3"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ================= 日榜 ================= -->
        <div class="tab-panel" id="panel-daily">
            <div class="range-hint" style="margin-bottom:8px;">
                00:00–06:00 数据不更新（<span id="dailyTopDate" style="color:#ea3690;font-weight:bold;"></span>）
            </div>
            <div class="score-row">
                <div class="score-table-col">
                    <div class="card">
                        <div class="title">日榜 · 当日最近10条</div>
                        <div class="table-scroll-box">
                            <table class="recent-table">
                                <colgroup>
                                    <col style="width: 14%;">
                                    <col style="width: 18%;"><col style="width: 12%;">
                                    <col style="width: 18%;"><col style="width: 12%;">
                                    <col style="width: 18%;"><col style="width: 12%;">
                                </colgroup>
                                <thead>
                                    <tr>
                                        <th rowspan="2">时间</th>
                                        <th colspan="2">1</th>
                                        <th colspan="2">2</th>
                                        <th colspan="2">3</th>
                                    </tr>
                                    <tr>
                                        <th>歌名-歌手</th><th>总分 / 增幅</th>
                                        <th>歌名-歌手</th><th>总分 / 增幅</th>
                                        <th>歌名-歌手</th><th>总分 / 增幅</th>

                    <div class="card">

                </div>

            <!-- TOP1/2/3 -->
            <div class="charts-row">
                <div class="chart-col-3">
                    <div class="card">
                        <div class="title">日榜 · TOP1</div>
                        <div class="chart-legend-text" id="dailyRank1Legend"></div>
                        <div class="chart-wrapper" id="chartDailyRank1"></div>
                    </div>
                </div>
                <div class="chart-col-3">
                    <div class="card">
                        <div class="title">日榜 · TOP2</div>
                        <div class="chart-legend-text" id="dailyRank2Legend"></div>
                        <div class="chart-wrapper" id="chartDailyRank2"></div>
                    </div>
                </div>
                <div class="chart-col-3">
                    <div class="card">
                        <div class="title">日榜 · TOP3</div>
                        <div class="chart-legend-text" id="dailyRank3Legend"></div>
                        <div class="chart-wrapper" id="chartDailyRank3"></div>

</div>

<script>
const lineColors = ['#ea3690', '#7c3aed', '#f97316', '#00e268', '#f5cc0b', '#10b981', '#c4b5fd', '#ef4444', '#14b8a6', '#64748b'];

const rankFields = [
    { key: '得分',     color: '#ea3690' },
    { key: '播放热度', color: '#7c3aed' },
    { key: '畅销度',   color: '#f97316' },
    { key: '推荐度',   color: '#00e268' },
];

const chartDaily = echarts.init(document.getElementById('chartDaily'));
const chartWeekly = echarts.init(document.getElementById('chartWeekly'));

const chartWeeklyRank1 = echarts.init(document.getElementById('chartWeeklyRank1'));
const chartWeeklyRank2 = echarts.init(document.getElementById('chartWeeklyRank2'));
const chartWeeklyRank3 = echarts.init(document.getElementById('chartWeeklyRank3'));
const chartDailyRank1 = echarts.init(document.getElementById('chartDailyRank1'));
const chartDailyRank2 = echarts.init(document.getElementById('chartDailyRank2'));
const chartDailyRank3 = echarts.init(document.getElementById('chartDailyRank3'));

const allCharts = [chartDaily, chartWeekly,
                   chartWeeklyRank1, chartWeeklyRank2, chartWeeklyRank3,
                   chartDailyRank1, chartDailyRank2, chartDailyRank3];
allCharts.forEach(c => c.showLoading());

function colorClass(v) {
    if (v === undefined || v === null || v === '') return '';
    const fv = parseFloat(v);
    if (isNaN(fv)) return '';
    return fv > 0 ? 'up' : 'flat';
}

function stripYear(timeStr) {
    if (!timeStr) return '';
    return timeStr.replace(/^\d{4}[-/]/, '');
}

function parseTime(s) {
    const m = (s || '').match(/(\d{4})[-/](\d{1,2})[-/](\d{1,2})(?:[ T](\d{1,2}):(\d{1,2})(?::(\d{1,2}))?)?/);
    if (!m) return null;
    return new Date(
        parseInt(m[1]), parseInt(m[2]) - 1, parseInt(m[3]),
        m[4] ? parseInt(m[4]) : 0,
        m[5] ? parseInt(m[5]) : 0,
        m[6] ? parseInt(m[6]) : 0
    );
}

function getTodayDateForDaily() {
    const now = new Date();
    const effective = new Date(now);
    if (now.getHours() === 0 && now.getMinutes() < 10) {
        effective.setDate(effective.getDate() - 1);
    }
    return effective;
}

function fmtDateLabel(d) {
    return `${d.getMonth() + 1}月${d.getDate()}日`;
}

function fmtDateKey(d) {
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

function refreshDailyTopDate() {
    const el = document.getElementById('dailyTopDate');
    if (el) el.textContent = fmtDateLabel(getTodayDateForDaily());
}

/**
 * 渲染最近10条表格
 * @param {Array} rows 原始数据
 * @param {String} tbodyId 表格tbody的id
 * @param {Boolean} sameDayOnly 是否只保留“当日”的记录（日榜传true，周榜传false）
 */
function renderRecentTable(rows, tbodyId, sameDayOnly) {
    const tbody = document.getElementById(tbodyId);
    if (!rows.length) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:#999;">暂无数据</td></tr>';
        return;
    }

    const sorted = [...rows].sort((a, b) => (b['时间'] || '').localeCompare(a['时间'] || ''));

    let filtered = sorted;

    // 日榜：只保留“当日”的记录
    if (sameDayOnly) {
        const todayKey = fmtDateKey(getTodayDateForDaily());
        filtered = filtered.filter(r => {
            const t = parseTime(r['时间']);
            if (!t) return false;
            return fmtDateKey(t) === todayKey;
        });
    }

    // 跳过 1:00–5:59 的记录
    filtered = filtered.filter(r => {
        const t = parseTime(r['时间']);
        if (!t) return true;
        const h = t.getHours();
        return !(h >= 1 && h <= 5);
    });

    const recent = filtered.slice(0, 10);

    if (!recent.length) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:#999;">暂无数据</td></tr>';
        return;
    }

    const htmlRows = recent.map(r => {
        const displayTime = stripYear(r['时间'] || '');
        const cells = [`<td>${displayTime}</td>`];
        for (let i = 1; i <= 3; i++) {
            const name = r[`第${i}名歌名`] || '';
            const singer = r[`第${i}名歌手`] || '';
            const song = singer ? `${name}-${singer}` : name;
            const score = r[`第${i}名得分`] || '';
            const change = r[`第${i}名官方增幅`] || '';
            const changeText = change === '' ? '' : '+' + change;
            const cls = colorClass(change);
            cells.push(`<td class="song-cell" title="${song}">${song}</td>`);
            cells.push(`<td><span class="val-score">${score}</span> / <span class="${cls}">${changeText}</span></td>`);
        }
        return `<tr>${cells.join('')}</tr>`;
    });

    // 不足10条时补占位空行，保持表格高度一致
    const placeholderCount = 10 - recent.length;
    for (let i = 0; i < placeholderCount; i++) {
        htmlRows.push(`<tr class="placeholder-row">
            <td>&nbsp;</td>
            <td>&nbsp;</td><td>&nbsp;</td>
            <td>&nbsp;</td><td>&nbsp;</td>
            <td>&nbsp;</td><td>&nbsp;</td>
        </tr>`);
    }

    tbody.innerHTML = htmlRows.join('');
}

function buildAxis(rows, range) {
    const allSorted = [...rows].sort((a, b) => (a['时间'] || '').localeCompare(b['时间'] || ''));
    const now = new Date();
    let rowsByColumn = [];
    let times = [];
    let fullTimes = [];

    if (range === '3') {
        const cutoff = now.getTime() - 3 * 60 * 60 * 1000;
        const inRange = allSorted.filter(r => {
            const t = parseTime(r['时间']);
            return t && t.getTime() >= cutoff;
        });
        rowsByColumn = inRange;
        times = inRange.map(r => {
            const t = r['时间'] || '';
            const p = t.split(' ');
            return p.length > 1 ? p[1] : t;
        });
        fullTimes = times.slice();
    } else if (range === '3d') {
        // 最近三天：每天 06:06、12:06、18:06、次日 00:06
        const effectiveToday = getTodayDateForDaily();

        const rowByKey = {};
        allSorted.forEach(r => {
            const t = parseTime(r['时间']);
            if (!t) return;
            const key = `${fmtDateKey(t)} ${String(t.getHours()).padStart(2, '0')}:${String(t.getMinutes()).padStart(2, '0')}`;
            rowByKey[key] = r;
        });

        const days = [];
        for (let i = 2; i >= 0; i--) {
            const d = new Date(effectiveToday);
            d.setDate(d.getDate() - i);
            days.push(d);
        }

        days.forEach(d => {
            const dayKey = fmtDateKey(d);
            const nextDay = new Date(d);
            nextDay.setDate(nextDay.getDate() + 1);
            const nextKey = fmtDateKey(nextDay);
            const dayLabel = `${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

            // 当天 06:06、12:06、18:06
            [6, 12, 18].forEach((h, idx) => {
                const key = `${dayKey} ${String(h).padStart(2, '0')}:06`;
                const full = `${dayLabel} ${String(h).padStart(2, '0')}:06`;
                rowsByColumn.push(rowByKey[key] || null);
                // 每天第一个点带日期，后面只显示时间
                times.push(idx === 0 ? full : `${String(h).padStart(2, '0')}:06`);
                fullTimes.push(full);
            });

            // 次日 00:06
            const key0 = `${nextKey} 00:06`;
            const nextLabel = `${String(nextDay.getMonth() + 1).padStart(2, '0')}-${String(nextDay.getDate()).padStart(2, '0')}`;
            const full0 = `${nextLabel} 00:06`;
            rowsByColumn.push(rowByKey[key0] || null);
            times.push('00:06');
            fullTimes.push(full0);
        });
    } else if (range === '24') {
        const byMin06 = {};
        allSorted.forEach(r => {
            const t = parseTime(r['时间']);
            if (!t || t.getMinutes() !== 6) return;
            const key = `${fmtDateKey(t)} ${String(t.getHours()).padStart(2, '0')}:06`;
            byMin06[key] = r;
        });
        for (let i = 23; i >= 0; i--) {
            const d = new Date(now.getTime() - i * 60 * 60 * 1000);
            const key = `${fmtDateKey(d)} ${String(d.getHours()).padStart(2, '0')}:06`;
            rowsByColumn.push(byMin06[key] || null);
            const label = `${String(d.getHours()).padStart(2, '0')}:06`;
            times.push(label);
            fullTimes.push(label);
        }
    } else if (range === '10d') {
        const effectiveToday = getTodayDateForDaily();

        // 按“有效日”归组：00:10 前算前一天
        const dayMap = {};
        allSorted.forEach(r => {
            const t = parseTime(r['时间']);
            if (!t) return;
            const eff = new Date(t);
            if (t.getHours() === 0 && t.getMinutes() < 10) {
                eff.setDate(eff.getDate() - 1);
            }
            const dayKey = fmtDateKey(eff);
            dayMap[dayKey] = r;   // 同一天多条时，后覆盖前（即该有效日最晚一条）
        });

        for (let i = 9; i >= 0; i--) {
            const d = new Date(effectiveToday);
            d.setDate(d.getDate() - i);
            const key = fmtDateKey(d);
            rowsByColumn.push(dayMap[key] || null);
            const label = `${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
            times.push(label);
            fullTimes.push(label);
        }
    } else {
        const baseDay = getTodayDateForDaily();
        const nextDay = new Date(baseDay);
        nextDay.setDate(nextDay.getDate() + 1);
        const rowByKey = {};
        allSorted.forEach(r => {
            const t = parseTime(r['时间']);
            if (!t) return;
            const key = `${fmtDateKey(t)} ${String(t.getHours()).padStart(2, '0')}:${String(t.getMinutes()).padStart(2, '0')}`;
            rowByKey[key] = r;
        });
        for (let h = 6; h <= 23; h++) {
            const key = `${fmtDateKey(baseDay)} ${String(h).padStart(2, '0')}:06`;
            rowsByColumn.push(rowByKey[key] || null);
            const label = `${String(h).padStart(2, '0')}:06`;
            times.push(label);
            fullTimes.push(label);
        }
        const key24 = `${fmtDateKey(nextDay)} 00:16`;
        rowsByColumn.push(rowByKey[key24] || null);
        times.push('24:00');
        fullTimes.push('24:00');
    }

    return { rowsByColumn, times, fullTimes };
}

function calcScoreYRange(rows, mode) {
    let ranges;
    if (mode === 'weekly') {
        ranges = ['3d', '10d'];
    } else {
        ranges = ['today'];
    }
    let min = Infinity, max = -Infinity;
    ranges.forEach(range => {
        const { rowsByColumn } = buildAxis(rows, range);
        rowsByColumn.forEach(r => {
            if (!r) return;
            for (let rank = 1; rank <= 3; rank++) {
                const s = r[`第${rank}名得分`] || '';
                const v = parseFloat(s);
                if (!isNaN(v)) {
                    if (v < min) min = v;
                    if (v > max) max = v;
                }
            }
        });
    });
    if (!isFinite(min) || !isFinite(max)) return { min: undefined, max: undefined };
    const pad = Math.max((max - min) * 0.08, 1);
    min = Math.floor((min - pad) / 5) * 5;
    max = Math.ceil((max + pad) / 5) * 5;
    if (max <= min) max = min + 5;
    return { min, max };
}

        if (rowsByColumn[i]) { latest = rowsByColumn[i]; break; }
    }

    if (!latest) {
        chartInst.hideLoading();

        }, true);

        return;
    }

        return singer ? `${singer}-${name}` : name;
    };

    const songOrder = [];
    const songSet = new Set();
    for (let rank = 1; rank <= 3; rank++) {

        if (key && !songSet.has(key)) { songSet.add(key); songOrder.push(key); }
    }
    for (let i = rowsByColumn.length - 1; i >= 0; i--) {

    }

    });

        return rowsByColumn.map(r => {

            for (let rank = 1; rank <= 3; rank++) {
