<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>腾讯音乐由你榜 · TOP3</title>
<link rel="stylesheet" href="common.css">
<style>
    html, body { height: 100%; }
    body { overflow: hidden; }

    .tab-bar {
        display: flex; justify-content: center; gap: 10px;
        margin-bottom: 14px; flex-wrap: wrap;
    }
    .tab-btn {
        border: 1px solid rgba(234,54,144,0.35); background: white; color: #ea3690;
        font-size: 15px; font-weight: bold; padding: 8px 26px; border-radius: 20px;
        cursor: pointer; transition: all 0.2s ease; outline: none;
        font-family: inherit;
    }
    .tab-btn.active {
        background: #ea3690; color: white; border-color: #ea3690;
        box-shadow: 0 3px 10px rgba(234,54,144,0.25);
    }

    .frame-wrap {
        position: fixed;
        top: 86px; left: 0; right: 0; bottom: 0;
        background: #faf7f9;
    }
    iframe {
        width: 100%; height: 100%; border: 0; display: block;
        background: #faf7f9;
    }
</style>
</head>
<body>
<div class="container">
    <h1>腾讯音乐由你榜 · TOP3</h1>
    <div class="tab-bar">
        <button class="tab-btn active" data-src="weekly.html">周榜</button>
        <button class="tab-btn" data-src="daily.html">日榜</button>
        <button class="tab-btn" data-src="song.html">单曲追踪</button>
    </div>
</div>
<div class="frame-wrap">
    <iframe id="pageFrame" src="weekly.html" title="榜单内容"></iframe>
</div>

<script>
(function () {
    const frame = document.getElementById('pageFrame');
    const buttons = document.querySelectorAll('.tab-btn');

    buttons.forEach(btn => {
        btn.addEventListener('click', function () {
            if (this.classList.contains('active')) return;
            buttons.forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            frame.src = this.dataset.src;
        });
    });
})();
</script>
</body>
</html>
