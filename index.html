<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>腾讯音乐由你榜 · 前三追踪</title>
<script src="https://cdn.bootcdn.net/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
    body {
        margin: 0; padding: 8px; background-color: #faf7f9;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        display: flex; flex-direction: column; align-items: center; overflow-x: hidden;
    }
    .container { width: 100%; max-width: 1400px; }
    h1 { text-align: center; color: #ea3690; font-size: 18px; margin: 10px 0; }
    .update-time { text-align: center; color: #999; font-size: 12px; margin-bottom: 12px; }

    .charts-row { display: flex; flex-wrap: wrap; gap: 12px; width: 100%; }
    .chart-col { flex: 1 1 520px; min-width: 0; }

    .card {
        background: white; border-radius: 12px; box-shadow: 0 4px 12px rgba(234,54,144,0.08);
        padding: 12px 0; overflow: hidden; border: 1px solid rgba(234,54,144,0.10);
    }
    .title { text-align: center; color: #ea3690; font-size: 15px; font-weight: bold; margin: 5px 0 8px 0; }
    .chart-legend-text {
        text-align: center; font-size: 12px; color: #666;
        margin: 0 10px 6px 10px; line-height: 1.8;
    }
    .chart-legend-text .item { display: inline-block; margin: 0 6px; }
    .chart-legend-text .dot {
        display: inline-block; width: 8px; height: 8px; border-radius: 50%;
        margin-right: 4px; vertical-align: middle;
    }
    .chart-wrapper { width: 100%; height: 350px; }
    #loading { text-align: center; color: #999; font-size: 16px; margin-top: 50px; }
</style>
</head>
<body>
<div class="container">
    <h1>腾讯音乐由你榜 · 日榜/周榜前三</h1>
    <div class="update-time" id="updateTime"></div>
    <div id="loading">正在加载数据...</div>
    <div id="content" style="display:none;">
        <div class="charts-row">
            <div class="chart-col">
                <div class="card">
                    <div class="title">📅 日榜前三得分趋势</div>
                    <div class="chart-legend-text" id="dailyLegend"></div>
                    <div class="chart-wrapper" id="chartDaily"></div>
                </div>
            </div>
            <div class="chart-col">
                <div class="card">
                    <div class="title">📆 周榜前三得分趋势</div>
                    <div class="chart-legend-text" id="weeklyLegend"></div>
                    <div class="chart-wrapper" id="chartWeekly"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
const chartDaily = echarts.init(document.getElementById('chartDaily'));
const chartWeekly = echarts.init(document.getElementById('chartWeekly'));
chartDaily.showLoading();
chartWeekly.showLoading();

// 三条线颜色：玫红 / 绿 / 金橙，不含蓝色
const lineColors = ['#ea3690', '#1f9d55', '#e6a23c'];

function renderChart(rows, chartInstance, legendContainerId) {
    const legendEl = document.getElementById(legendContainerId);
    if (!rows.length) {
        chartInstance.hideLoading();
        chartInstance.setOption({
            title: { text: '暂无数据', left: 'center', top: 'middle', textStyle: { color: '#999', fontSize: 14 } }
        }, true);
        if (legendEl) legendEl.innerHTML = '';
        return;
    }

    const sorted = [...rows].sort((a, b) => (a['时间'] || '').localeCompare(b['时间'] || ''));
    const times = sorted.map(r => {
        const t = r['时间'] || '';
        const p = t.split(' ');
        return p.length > 1 ? p[1] : t;
    });
    const latest = sorted[sorted.length - 1];

    function legendText(rank) {
        const name = latest[`第${rank}名歌名`] || '';
        const singer = latest[`第${rank}名歌手`] || '';
        if (!name) return `第${rank}名`;
        return singer ? `${singer} - ${name}` : name;
    }

    function seriesData(rank) {
        return sorted.map(r => {
            const s = r[`第${rank}名得分`] || '';
            return s === '' ? null : parseFloat(s);
        });
    }

    function tooltipData(rank) {
        return sorted.map(r => ({
            name: r[`第${rank}名歌名`] || '',
            singer: r[`第${rank}名歌手`] || '',
            score: r[`第${rank}名得分`] || '',
            play: r[`第${rank}名播放热度`] || '',
            sales: r[`第${rank}名畅销度`] || '',
            recommend: r[`第${rank}名推荐度`] || '',
        }));
    }

    const series = [1, 2, 3].map((rank, idx) => ({
        name: `第${rank}名`,
        type: 'line',
        data: seriesData(rank),
        smooth: false,
        symbol: 'circle',
        symbolSize: 4,
        connectNulls: false,
        itemStyle: { color: lineColors[idx] },
        lineStyle: { width: 2, color: lineColors[idx] },
        emphasis: { focus: 'series' },
    }));

    const tt = [1, 2, 3].map(rank => tooltipData(rank));

    if (legendEl) {
        const marks = ['①', '②', '③'];
        legendEl.innerHTML = [1, 2, 3].map((rank, idx) =>
            `<span class="item"><span class="dot" style="background:${lineColors[idx]}"></span>${marks[idx]}${legendText(rank)}</span>`
        ).join('');
    }

    chartInstance.hideLoading();
    chartInstance.setOption({
        color: lineColors,
        tooltip: {
            trigger: 'axis',
            confine: true,
            formatter: function(params) {
                if (!params.length) return '';
                const i = params[0].dataIndex;
                let html = `<div style="font-weight:bold;margin-bottom:4px;">${sorted[i]['时间']}</div>`;
                params.forEach(p => {
                    const rank = p.seriesIndex + 1;
                    const d = tt[p.seriesIndex][i];
                    html += `<div style="margin-bottom:3px;">${p.marker} 第${rank}名：${d.singer ? d.singer + ' - ' : ''}${d.name} <b>${d.score}</b><br>`
                          + `<span style="color:#888;font-size:11px;">播放热度 ${d.play}｜畅销度 ${d.sales}｜推荐度 ${d.recommend}</span></div>`;
                });
                return html;
            }
        },
        grid: { left: '2%', right: '5%', bottom: '12%', top: '8%', containLabel: true },
        xAxis: {
            type: 'category',
            boundaryGap: false,
            data: times,
            axisLabel: { interval: 'auto', fontSize: 11, color: '#888', rotate: 45 },
            axisLine: { lineStyle: { color: '#f0d6e4' } },
        },
        yAxis: {
            type: 'value',
            name: '得分',
            nameTextStyle: { color: '#999' },
            scale: true,
            axisLabel: { fontSize: 11, color: '#888' },
            axisLine: { lineStyle: { color: '#f0d6e4' } },
            splitLine: { lineStyle: { color: '#faf0f6' } },
        },
        series: series,
    }, true);
}

Papa.parse('uni_chart_data.csv?t=' + new Date().getTime(), {
    download: true,
    header: true,
    skipEmptyLines: true,
    encoding: 'UTF-8',
    complete: function(results) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('content').style.display = 'block';

        const data = results.data || [];
        const dailyRows = data.filter(r => r['榜单类型'] === '日榜');
        const weeklyRows = data.filter(r => r['榜单类型'] === '周榜');

        renderChart(dailyRows, chartDaily, 'dailyLegend');
        renderChart(weeklyRows, chartWeekly, 'weeklyLegend');
        chartDaily.resize();
        chartWeekly.resize();

        const allTimes = data.map(r => r['时间']).filter(Boolean).sort();
        if (allTimes.length) {
            document.getElementById('updateTime').innerText = `数据最后更新：${allTimes[allTimes.length - 1]}`;
        }
    },
    error: function(err) {
        document.getElementById('loading').innerText = '加载 uni_chart_data.csv 失败，请确认文件在同目录下。';
        console.error(err);
    }
});

let resizeTimer;
window.addEventListener('resize', function() {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function() {
        chartDaily.resize();
        chartWeekly.resize();
    }, 200);
});
</script>
</body>
</html>
