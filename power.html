<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>电力</title>
<link rel="stylesheet" href="common.css">
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
  .check-cell {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    min-height: 38px;
  }
  .check-box {
    width: 22px;
    height: 22px;
    border-radius: 6px;
    border: 2px solid #f0d6e4;
    background: white;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: 0.15s;
    font-size: 14px;
    color: transparent;
    font-weight: bold;
    user-select: none;
    flex-shrink: 0;
  }
  .check-box:hover { border-color: #ea3690; }
  .check-box.checked { background: #ea3690; border-color: #ea3690; color: #fff; }

  .daily-check {
    width: 22px;
    height: 22px;
    border-radius: 6px;
    border: 2px solid #f0d6e4;
    background: white;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: 0.15s;
    font-size: 14px;
    color: transparent;
    font-weight: bold;
    user-select: none;
  }
  .daily-check:hover { border-color: #f97316; }
  .daily-check.checked { background: #f97316; border-color: #f97316; color: #fff; }

  .shared-cell {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    min-height: 38px;
  }

  .timer-text {
    display: block;
    font-size: 9px;
    font-weight: bold;
    white-space: nowrap;
    line-height: 12px;
    height: 12px;
    min-height: 12px;
    color: #f97316;
    font-variant-numeric: tabular-nums;
    cursor: pointer;
    text-decoration: underline dotted;
  }
  .timer-text.idle { color: #c7c7c7; }
  .timer-text.ready { color: #22c55e; }
  .timer-text:hover { color: #ea3690; }

  input.remark-input {
    width: 100%;
    max-width: 100px;
    height: 26px;
    padding: 0 6px;
    text-align: left;
    background: white;
    border: 1px solid #f0d6e4;
    border-radius: 6px;
    color: #555;
    font-size: 11px;
    font-family: inherit;
    outline: none;
    transition: 0.15s;
  }
  input.remark-input:focus {
    border-color: #ea3690;
    box-shadow: 0 0 0 2px rgba(234,54,144,0.12);
  }
  input.remark-input::placeholder { color: #ccc; }

  input.power-input {
    width: 100%;
    max-width: 70px;
    height: 26px;
    padding: 0 4px;
    text-align: center;
    background: white;
    border: 1px solid #f0d6e4;
    border-radius: 6px;
    color: #333;
    font-size: 11px;
    font-weight: bold;
    font-family: inherit;
    outline: none;
    transition: 0.15s;
    -moz-appearance: textfield;
    appearance: textfield;
  }
  input.power-input::-webkit-outer-spin-button,
  input.power-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  input.power-input:focus {
    border-color: #ea3690;
    box-shadow: 0 0 0 2px rgba(234,54,144,0.12);
  }
  input.power-input::placeholder { color: #ccc; font-weight: normal; }

  .disable-check {
    width: 20px;
    height: 20px;
    border-radius: 5px;
    border: 2px solid #f0d6e4;
    background: white;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: 0.15s;
    font-size: 12px;
    color: transparent;
    font-weight: bold;
    user-select: none;
  }
  .disable-check:hover { border-color: #f97316; }
  .disable-check.checked { background: #f97316; border-color: #f97316; color: #fff; }

  .del-btn {
    width: 24px; height: 24px; border-radius: 50%;
    border: 1px solid rgba(231,76,60,0.35);
    background: white; color: #e74c3c; font-size: 14px; line-height: 1;
    cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
    transition: 0.15s; font-family: inherit; padding: 0;
  }
  .del-btn:hover { background: rgba(231,76,60,0.1); border-color: #e74c3c; }

  tr.row-disabled .account-text {
    color: #bbb;
    text-decoration: line-through;
  }
  tr.row-disabled .remark-input,
  tr.row-disabled .power-input {
    background: #fafafa;
    color: #bbb;
  }

  .check-box.disabled,
  .daily-check.disabled {
    background: #f3f3f3;
    border-color: #e0e0e0;
    cursor: not-allowed;
    pointer-events: none;
    color: transparent;
  }
  .check-box.checked.disabled,
  .daily-check.checked.disabled {
    background: #d9d9d9;
    border-color: #d0d0d0;
    color: #fff;
  }
  .timer-text.disabled-timer {
    pointer-events: none;
    text-decoration: none;
    cursor: default;
  }

  .stats-row.three {
    grid-template-columns: repeat(3, 1fr);
  }
</style>
</head>
<body>
  <!-- 电力总和放最左边 -->
  <div class="stats-row three">
    <div class="stat-card"><div class="s-label">电力总和</div><div class="s-value" id="powerSum">0</div></div>
    <div class="stat-card done"><div class="s-label">已完成账号</div><div class="s-value" id="powerDoneAccounts">0 / 0</div></div>
    <div class="stat-card done"><div class="s-label">下一轮时间</div><div class="s-value" id="powerNextTime" style="font-size:13px;">—</div></div>
  </div>

  <div class="toolbar">
    <button id="powerClearDataBtn" class="danger">清空数据</button>
    <button id="powerResetRoundBtn">重置轮次</button>
  </div>

  <div class="table-box" id="powerTableBox"></div>

<script>
(function(){
  const SHARED = '盲盒';
  const DAILY_PLATFORMS = ['安卓', '苹果'];
  const POWER_INTERVAL_MS = 4 * 60 * 60 * 1000;
  const POWER_STORAGE_KEY = 'bang_power_state';

  let ACCOUNTS = [];
  let records = {};
  let dailyDate = '';
  let timerInterval = null;

  let modalRequestCounter = 0;
  const pendingModalResolvers = {};

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function normalizeName(name) { return String(name).trim().replace(/\s+/g, ' '); }
  function pad2(n) { return String(n).padStart(2, '0'); }

  function formatTimeMinute(ts) {
    const d = new Date(ts);
    return `${pad2(d.getMonth()+1)}-${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
  }

  function formatCountdownMinute(ms) {
    if (ms <= 0) return '可做';
    const totalMin = Math.floor(ms / 60000);
    if (totalMin < 1) return '<1分';
    const h = Math.floor(totalMin / 60);
    const m = totalMin % 60;
    if (h > 0) return `${pad2(h)}:${pad2(m)}`;
    return `${m}分`;
  }

  const IDLE_TEXT = '—';

  function todayStr() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }

  function getNextAvailableTs(ts) {
    if (!ts || ts <= 0) return 0;
    const after4h = ts + POWER_INTERVAL_MS;
    const d = new Date(ts);
    const nextMidnight = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1, 0, 0, 0, 0).getTime();
    return Math.min(after4h, nextMidnight);
  }
  function getSharedStatus(r) {
    if (!r || !r.done) return { done: false, ready: true, remaining: 0, nextTs: 0 };
    const nextTs = getNextAvailableTs(r.ts);
    const remaining = nextTs - Date.now();
    return { done: true, ready: remaining <= 0, remaining: Math.max(0, remaining), nextTs };
  }

  function notifyResize() {
    if (window.parent && window.parent !== window) {
      try {
        window.parent.postMessage({
          type: 'resize',
          module: 'power',
          height: document.body.scrollHeight
        }, '*');
      } catch(e) {}
    }
  }

  function requestDeleteAccount(name) {
    if (window.parent && window.parent !== window) {
      try {
        window.parent.postMessage({ type: 'delete-account', account: name }, '*');
      } catch(e) {}
    }
  }

  function requestModal(payload) {
    return new Promise(resolve => {
      if (!window.parent || window.parent === window) {
        if (payload.showInput !== false) {
          const v = prompt(payload.message || '', payload.defaultValue || '');
          resolve(v === null ? { confirmed: false, value: null } : { confirmed: true, value: v });
        } else {
          alert(payload.message || '');
          resolve({ confirmed: true, value: null });
        }
        return;
      }
      const requestId = 'modal_' + (++modalRequestCounter);
      pendingModalResolvers[requestId] = resolve;
      window.parent.postMessage({
        type: 'show-modal',
        requestId: requestId,
        payload: payload
      }, '*');
    });
  }

  window.addEventListener('message', function(e) {
    if (!e.data) return;
    if (e.data.type === 'modal-result') {
      const rid = e.data.requestId;
      if (pendingModalResolvers[rid]) {
        pendingModalResolvers[rid](e.data.value);
        delete pendingModalResolvers[rid];
      }
    }
  });

  function loadPowerState() {
    try {
      const raw = localStorage.getItem(POWER_STORAGE_KEY);
      if (raw) {
        const obj = JSON.parse(raw);
        if (obj && typeof obj === 'object' && obj.records && typeof obj.records === 'object') {
          return {
            records: obj.records,
            dailyDate: typeof obj.dailyDate === 'string' ? obj.dailyDate : ''
          };
        }
      }
    } catch(e) {}
    return { records: {}, dailyDate: '' };
  }
  function savePowerRecords() {
    localStorage.setItem(POWER_STORAGE_KEY, JSON.stringify({ records, dailyDate }));
  }

  function checkDailyReset() {
    const today = todayStr();
    if (dailyDate === today) return false;

    ACCOUNTS.forEach(a => {
      if (!records[a]) records[a] = {};
      DAILY_PLATFORMS.forEach(p => { records[a][p] = false; });
    });
    dailyDate = today;
    savePowerRecords();
    return true;
  }

  function clearDailyChecksDom() {
    document.querySelectorAll('.daily-check').forEach(el => {
      el.classList.remove('checked');
      el.textContent = '';
    });
    updatePowerStats();
    notifyResize();
  }

  function syncRecordsWithAccounts() {
    const normalized = {};
    Object.keys(records).forEach(k => {
      const nk = normalizeName(k);
      if (!normalized[nk]) normalized[nk] = records[k];
    });
    records = normalized;

    ACCOUNTS.forEach(a => {
      if (!records[a]) records[a] = {};
      DAILY_PLATFORMS.forEach(p => {
        if (typeof records[a][p] !== 'boolean') records[a][p] = false;
      });
      if (!records[a][SHARED] || typeof records[a][SHARED] !== 'object') {
        records[a][SHARED] = { done: false, ts: 0 };
      }
      if (typeof records[a].disabled !== 'boolean') records[a].disabled = false;
      if (typeof records[a].remark !== 'string') records[a].remark = '';
      if (typeof records[a].teamPower !== 'string') records[a].teamPower = '';
      if (typeof records[a].personalPower !== 'string') records[a].personalPower = '';
    });
    Object.keys(records).forEach(a => { if (!ACCOUNTS.includes(a)) delete records[a]; });
    ACCOUNTS = [...new Set(ACCOUNTS)];
  }

  function dailyCheckHtml(acc, pf, checked, disabled) {
    const cls = 'daily-check' + (checked ? ' checked' : '') + (disabled ? ' disabled' : '');
    return `<div class="${cls}" data-acc="${escapeHtml(acc)}" data-pf="${escapeHtml(pf)}" data-type="daily" title="${disabled ? '该账号电力不可用' : (checked ? '点击取消' : '点击标记完成')}">${checked ? '✓' : ''}</div>`;
  }

  function sharedHtml(acc, r, disabled) {
    const st = getSharedStatus(r);
    const checked = st.done;
    const cls = 'check-box' + (checked ? ' checked' : '') + (disabled ? ' disabled' : '');
    let timerCls = 'timer-text';
    let timerText = '';
    if (disabled) {
      timerCls += ' idle disabled-timer';
      timerText = '—';
    } else if (!st.done) {
      timerCls += ' idle';
      timerText = IDLE_TEXT;
    } else if (st.ready) {
      timerCls += ' ready';
      timerText = '可做';
    } else {
      timerText = formatCountdownMinute(st.remaining);
    }
    return `<div class="shared-cell">
      <div class="${cls}" data-acc="${escapeHtml(acc)}" data-pf="${SHARED}" data-type="shared" title="${disabled ? '该账号电力不可用' : (checked ? '点击取消勾选' : '点击标记为已完成')}">${checked ? '✓' : ''}</div>
      <span class="${timerCls}" data-timer="${escapeHtml(acc)}|${SHARED}" data-acc="${escapeHtml(acc)}" title="${disabled ? '' : '点击手动修改完成时间（只填时分）'}">${timerText}</span>
    </div>`;
  }

  function renderPower() {
    const box = document.getElementById('powerTableBox');
    let rows = '';
    if (ACCOUNTS.length === 0) {
      rows = `<tr class="empty-row"><td colspan="9">当前无账号，请在顶部「打榜账号」输入框中添加</td></tr>`;
    } else {
      rows = ACCOUNTS.map((a, idx) => {
        const rec = records[a] || {};
        const disabled = !!rec.disabled;
        const remark = rec.remark || '';
        const teamPower = rec.teamPower || '';
        const personalPower = rec.personalPower || '';
        return `<tr data-acc="${escapeHtml(a)}" class="${disabled ? 'row-disabled' : ''}">
          <td class="account-cell" title="${escapeHtml(a)}"><span class="account-text">${idx + 1}. ${escapeHtml(a)}</span></td>
          <td>${dailyCheckHtml(a, '安卓', !!rec['安卓'], disabled)}</td>
          <td>${dailyCheckHtml(a, '苹果', !!rec['苹果'], disabled)}</td>
          <td>${sharedHtml(a, rec[SHARED] || { done: false, ts: 0 }, disabled)}</td>
          <td><input class="power-input" type="number" min="0" step="1" placeholder="—" data-acc="${escapeHtml(a)}" data-field="teamPower" value="${escapeHtml(teamPower)}"></td>
          <td><input class="power-input" type="number" min="0" step="1" placeholder="—" data-acc="${escapeHtml(a)}" data-field="personalPower" value="${escapeHtml(personalPower)}"></td>
          <td><input class="remark-input" type="text" placeholder="备注" data-acc="${escapeHtml(a)}" value="${escapeHtml(remark)}"></td>
          <td><div class="disable-check ${disabled ? 'checked' : ''}" data-acc="${escapeHtml(a)}" title="${disabled ? '取消无法使用' : '标记为无法使用'}">${disabled ? '✓' : ''}</div></td>
          <td><button class="del-btn" data-acc="${escapeHtml(a)}" title="删除该账号">×</button></td>
        </tr>`;
      }).join('');
    }

    box.innerHTML = `<table>
      <colgroup>
        <col style="width:88px">
        <col style="width:auto">
        <col style="width:auto">
        <col style="width:auto">
        <col style="width:auto">
        <col style="width:auto">
        <col style="width:auto">
        <col style="width:auto">
        <col style="width:36px">
      </colgroup>
      <thead><tr>
        <th style="text-align:left;padding-left:6px;">账号</th>
        <th>安卓</th>
        <th>苹果</th>
        <th>盲盒</th>
        <th>团建电力</th>
        <th>个人电力</th>
        <th>备注</th>
        <th>无法使用</th>
        <th>操作</th>
      </tr></thead>
      <tbody>${rows}</tbody>
      <tfoot><tr>
        <td class="account-cell" style="color:#ea3690;">合计</td>
        <td><div class="col-total" id="pct-android">0 / 0</div></td>
        <td><div class="col-total" id="pct-ios">0 / 0</div></td>
        <td><div class="col-total" id="pct-shared">0 / 0</div></td>
        <td><div class="col-total" id="sum-team">0</div></td>
        <td><div class="col-total" id="sum-personal">0</div></td>
        <td></td><td></td><td></td>
      </tr></tfoot>
    </table>`;

    box.querySelectorAll('.daily-check:not(.disabled)').forEach(el => {
      el.addEventListener('click', function(){
        toggleDaily(this.dataset.acc, this.dataset.pf);
      });
    });

    box.querySelectorAll('.check-box:not(.disabled)').forEach(el => {
      el.addEventListener('click', function(){
        toggleShared(this.dataset.acc);
      });
    });

    box.querySelectorAll('.timer-text').forEach(el => {
      if (el.classList.contains('disabled-timer')) return;
      el.addEventListener('click', function(e){
        e.stopPropagation();
        manualEditSharedTime(this.dataset.acc);
      });
    });

    box.querySelectorAll('input.power-input').forEach(inp => {
      inp.addEventListener('input', function(){
        const acc = this.dataset.acc;
        const field = this.dataset.field;
        if (!records[acc]) return;
        records[acc][field] = this.value;
        savePowerRecords();
        updatePowerStats();
        notifyResize();
      });
    });

    box.querySelectorAll('input.remark-input').forEach(inp => {
      inp.addEventListener('change', function(){
        const acc = this.dataset.acc;
        if (!records[acc]) return;
        records[acc].remark = this.value;
        savePowerRecords();
      });
      inp.addEventListener('blur', function(){
        const acc = this.dataset.acc;
        if (!records[acc]) return;
        records[acc].remark = this.value;
        savePowerRecords();
      });
    });

    box.querySelectorAll('.disable-check').forEach(el => {
      el.addEventListener('click', function(){
        const acc = this.dataset.acc;
        if (!records[acc]) return;
        records[acc].disabled = !records[acc].disabled;
        if (records[acc].disabled) {
          DAILY_PLATFORMS.forEach(p => { records[acc][p] = false; });
          records[acc][SHARED] = { done: false, ts: 0 };
        }
        savePowerRecords();
        renderPower();
      });
    });

    box.querySelectorAll('.del-btn').forEach(btn => {
      btn.addEventListener('click', function(){
        requestDeleteAccount(this.dataset.acc);
      });
    });

    updatePowerStats();
    notifyResize();
  }

  function toggleDaily(acc, pf) {
    const rec = records[acc];
    if (!rec || rec.disabled) return;
    rec[pf] = !rec[pf];
    if (dailyDate !== todayStr()) dailyDate = todayStr();
    savePowerRecords();
    const el = document.querySelector(`.daily-check[data-acc="${CSS.escape(acc)}"][data-pf="${CSS.escape(pf)}"]`);
    if (el) {
      el.classList.toggle('checked', rec[pf]);
      el.textContent = rec[pf] ? '✓' : '';
    }
    updatePowerStats();
    notifyResize();
  }

  function toggleShared(acc) {
    const rec = records[acc];
    if (!rec || rec.disabled) return;
    const r = rec[SHARED] || { done: false, ts: 0 };
    if (r.done) rec[SHARED] = { done: false, ts: 0 };
    else rec[SHARED] = { done: true, ts: Date.now() };
    savePowerRecords();
    renderPower();
  }

  async function manualEditSharedTime(acc) {
    const rec = records[acc];
    if (!rec || rec.disabled) return;
    const r = rec[SHARED] || { done: false, ts: 0 };

    let currentText = '';
    if (r.done && r.ts) {
      const d = new Date(r.ts);
      currentText = `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
    }

    const result = await requestModal({
      title: '修改盲盒完成时间',
      messageHtml: `只填时分，例如 <b>14:30</b> 或 <b>1430</b><br><span class="hint">比现在晚按今天算，比现在早按昨天算。留空则清除完成记录。</span>`,
      showInput: true,
      defaultValue: currentText,
      placeholder: '例如 14:30',
      okText: '确定',
      cancelText: '取消'
    });

    if (!result || !result.confirmed) return;

    const trimmed = (result.value || '').trim();
    if (trimmed === '') {
      records[acc][SHARED] = { done: false, ts: 0 };
      savePowerRecords();
      renderPower();
      return;
    }

    const parsed = parseHourMinuteInput(trimmed);
    if (!parsed) {
      await requestModal({
        title: '格式错误',
        messageHtml: '时间格式不正确，请填写时分，例如 <b>14:30</b> 或 <b>1430</b>。',
        showInput: false,
        okText: '知道了'
      });
      return;
    }

    records[acc][SHARED] = { done: true, ts: parsed };
    savePowerRecords();
    renderPower();
  }

  function parseHourMinuteInput(str) {
    let m = str.match(/^(\d{1,2}):(\d{2})$/);
    if (!m) m = str.match(/^(\d{1,2})(\d{2})$/);
    if (!m) return 0;

    const hh = parseInt(m[1], 10);
    const mm = parseInt(m[2], 10);
    if (isNaN(hh) || isNaN(mm) || hh < 0 || hh > 23 || mm < 0 || mm > 59) return 0;

    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate(), hh, mm, 0, 0);
    let ts = today.getTime();

    if (ts > Date.now()) {
      ts -= 24 * 60 * 60 * 1000;
    }
    return ts;
  }

  function updatePowerStats() {
    const activeAccounts = ACCOUNTS.filter(a => records[a] && !records[a].disabled);

    let dailyDone = 0;
    activeAccounts.forEach(a => {
      const rec = records[a] || {};
      if (rec['安卓']) dailyDone++;
      if (rec['苹果']) dailyDone++;
    });
    const dailyTotal = activeAccounts.length * 2;

    let nextTs = 0, hasActive = false;
    activeAccounts.forEach(a => {
      const rec = records[a] || {};
      const r = rec[SHARED];
      if (r && r.done) {
        const st = getSharedStatus(r);
        if (!st.ready) {
          if (!hasActive || st.nextTs < nextTs) { nextTs = st.nextTs; hasActive = true; }
        }
      }
    });

    const da = document.getElementById('powerDoneAccounts');
    if (da) da.textContent = `${dailyDone} / ${dailyTotal}`;

    const nextEl = document.getElementById('powerNextTime');
    if (nextEl) {
      if (hasActive) { nextEl.textContent = formatTimeMinute(nextTs); nextEl.style.color = '#f97316'; }
      else { nextEl.textContent = activeAccounts.length > 0 ? '全部可做' : '—'; nextEl.style.color = '#22c55e'; }
    }

    let teamSum = 0, personalSum = 0;
    ACCOUNTS.forEach(a => {
      const rec = records[a] || {};
      const t = parseInt(rec.teamPower, 10);
      const p = parseInt(rec.personalPower, 10);
      if (!isNaN(t)) teamSum += t;
      if (!isNaN(p)) personalSum += p;
    });
    const totalSum = teamSum + personalSum;

    const sumEl = document.getElementById('powerSum');
    if (sumEl) sumEl.textContent = totalSum.toLocaleString();

    const androidDone = activeAccounts.filter(a => records[a] && records[a]['安卓']).length;
    const iosDone = activeAccounts.filter(a => records[a] && records[a]['苹果']).length;
    const sharedDone = activeAccounts.filter(a => records[a] && records[a][SHARED] && records[a][SHARED].done).length;

    const ea = document.getElementById('pct-android');
    if (ea) ea.textContent = `${androidDone} / ${activeAccounts.length}`;
    const ei = document.getElementById('pct-ios');
    if (ei) ei.textContent = `${iosDone} / ${activeAccounts.length}`;
    const es = document.getElementById('pct-shared');
    if (es) es.textContent = `${sharedDone} / ${activeAccounts.length}`;

    const st = document.getElementById('sum-team');
    if (st) st.textContent = teamSum.toLocaleString();
    const sp = document.getElementById('sum-personal');
    if (sp) sp.textContent = personalSum.toLocaleString();

    notifyResize();
  }

  function startTimer() {
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      if (checkDailyReset()) {
        clearDailyChecksDom();
        return;
      }
      document.querySelectorAll('[data-timer]').forEach(el => {
        const parts = el.dataset.timer.split('|');
        const acc = parts[0];
        const rec = records[acc];
        if (!rec) return;
        if (rec.disabled) {
          el.textContent = '—';
          el.className = 'timer-text idle disabled-timer';
          return;
        }
        const r = rec[SHARED];
        const st = getSharedStatus(r);
        if (!st.done) {
          el.textContent = IDLE_TEXT;
          el.className = 'timer-text idle';
        } else if (st.ready) {
          el.textContent = '可做';
          el.className = 'timer-text ready';
        } else {
          el.textContent = formatCountdownMinute(st.remaining);
          el.className = 'timer-text';
        }
      });
      updatePowerStats();
    }, 1000);
  }

  function clearPowerData() {
    if (!ACCOUNTS.length) { showAlert('提示', '当前没有账号，无需清空数据'); return; }
    let has = false;
    ACCOUNTS.forEach(a => {
      DAILY_PLATFORMS.forEach(p => { if (records[a] && records[a][p]) has = true; });
      const r = records[a] && records[a][SHARED];
      if (r && (r.done || r.ts)) has = true;
      if (records[a] && (records[a].teamPower || records[a].personalPower)) has = true;
    });
    if (!has) { showAlert('提示', '当前所有电力记录已经是空的'); return; }
    showConfirm('清空数据', '确定要清空电力模块的所有勾选和数值记录吗？账号列表、备注、无法使用标记会保留。', function(ok) {
      if (!ok) return;
      ACCOUNTS.forEach(a => {
        if (!records[a]) records[a] = {};
        DAILY_PLATFORMS.forEach(p => { records[a][p] = false; });
        records[a][SHARED] = { done: false, ts: 0 };
        records[a].teamPower = '';
        records[a].personalPower = '';
      });
      dailyDate = todayStr();
      savePowerRecords();
      renderPower();
    });
  }

  function resetPowerRound() {
    if (!ACCOUNTS.length) { showAlert('提示', '当前没有账号'); return; }
    showConfirm('重置轮次', '确定要重置所有账号的盲盒电力轮次吗？盲盒勾选和计时会被清除，安卓/苹果每日任务、团建电力、个人电力不受影响。', function(ok) {
      if (!ok) return;
      ACCOUNTS.forEach(a => {
        if (!records[a]) records[a] = {};
        records[a][SHARED] = { done: false, ts: 0 };
      });
      savePowerRecords();
      renderPower();
    });
  }

  function showAlert(title, message) {
    if (window.parent && window.parent !== window) {
      requestModal({ title: title, messageHtml: escapeHtml(message), showInput: false, showCancel: false, okText: '知道了' });
    } else {
      alert(message);
    }
  }
  function showConfirm(title, message, onResult) {
    if (window.parent && window.parent !== window) {
      requestModal({ title: title, messageHtml: escapeHtml(message), showInput: false, showCancel: true, okText: '确定', cancelText: '取消' }).then(r => {
        onResult(!!(r && r.confirmed));
      });
    } else {
      onResult(confirm(message));
    }
  }

  window.addEventListener('message', function(e) {
    if (!e.data || e.data.type !== 'accounts-changed') return;
    const incoming = Array.isArray(e.data.accounts) ? e.data.accounts : [];
    ACCOUNTS = incoming.filter(x => typeof x === 'string' && x.trim() !== '').map(normalizeName);
    const loaded = loadPowerState();
    records = loaded.records;
    dailyDate = loaded.dailyDate;
    syncRecordsWithAccounts();
    if (checkDailyReset()) {
      savePowerRecords();
      renderPower();
      clearDailyChecksDom();
    } else {
      renderPower();
    }
  });

  // ===== 截图响应（账号打码 ***） =====
  window.addEventListener('message', async function(e) {
    if (!e.data || e.data.type !== 'capture') return;
    try {
      const statsRow = document.querySelector('.stats-row');
      const tableBox = document.querySelector('.table-box');
      if (!statsRow || !tableBox) {
        window.parent.postMessage({ type: 'capture-result', dataURL: null }, '*');
        return;
      }

      // 克隆统计卡片
      const statsClone = statsRow.cloneNode(true);

      // 克隆表格
      const tableClone = tableBox.cloneNode(true);
      // 删除操作列（每行最后一个 td / th）
      tableClone.querySelectorAll('tr').forEach(tr => {
        const cells = tr.children;
        if (cells.length > 0) {
          tr.removeChild(cells[cells.length - 1]);
        }
      });

      // 同步删除 colgroup 里操作列对应的 col
      const colgroup = tableClone.querySelector('colgroup');
      if (colgroup) {
        const cols = colgroup.querySelectorAll('col');
        if (cols.length > 0) {
          colgroup.removeChild(cols[cols.length - 1]);
        }
      }
      tableClone.querySelectorAll('tbody tr').forEach((tr, idx) => {
        const accountText = tr.querySelector('.account-text');
        if (accountText) accountText.textContent = `${idx + 1}.***`;
      });
      tableClone.querySelectorAll('.account-cell').forEach(el => {
        el.removeAttribute('title');
      });
      tableClone.querySelectorAll('[data-acc]').forEach(el => {
        el.setAttribute('data-acc', '***');
      });
      tableClone.scrollLeft = 0;
      tableClone.style.maxHeight = 'none';
      tableClone.style.overflowY = 'visible';

      // 临时容器：宽度至少 800，保证移动端也能完整渲染
      const wrapper = document.createElement('div');
      wrapper.style.background = '#fff';
      wrapper.style.padding = '8px';
      wrapper.style.width = Math.max(tableBox.scrollWidth || 0, 800) + 'px';
      wrapper.style.position = 'fixed';
      wrapper.style.left = '-99999px';
      wrapper.style.top = '0';
      wrapper.style.zIndex = '-1';
      // 截图时放大字号
      const styleOverride = document.createElement('style');
      styleOverride.textContent = `
        .capture-mode table { font-size: 14px !important; }
        .capture-mode th, .capture-mode td { font-size: 14px !important; }
        .capture-mode input { font-size: 14px !important; }`;
      wrapper.classList.add('capture-mode');
      wrapper.appendChild(styleOverride);
      wrapper.appendChild(statsClone);
      wrapper.appendChild(tableClone);
      document.body.appendChild(wrapper);

      // 等一帧让布局稳定
      await new Promise(r => setTimeout(r, 50));

      const canvas = await html2canvas(wrapper, {
        backgroundColor: '#ffffff',
        scale: 2,
        useCORS: true,
        logging: false,
        width: wrapper.scrollWidth,
        height: wrapper.scrollHeight
      });

      document.body.removeChild(wrapper);

      const dataURL = canvas.toDataURL('image/png');
      window.parent.postMessage({ type: 'capture-result', dataURL: dataURL }, '*');
    } catch(err) {
      console.error('capture failed', err);
      window.parent.postMessage({ type: 'capture-result', dataURL: null }, '*');
    }
  });

  function init() {
    const loaded = loadPowerState();
    records = loaded.records;
    dailyDate = loaded.dailyDate;

    syncRecordsWithAccounts();
    if (checkDailyReset()) {
      renderPower();
      clearDailyChecksDom();
    } else {
      renderPower();
    }

    document.getElementById('powerClearDataBtn').addEventListener('click', clearPowerData);
    document.getElementById('powerResetRoundBtn').addEventListener('click', resetPowerRound);

    startTimer();

    document.addEventListener('visibilitychange', function(){
      if (!document.hidden) {
        if (checkDailyReset()) {
          clearDailyChecksDom();
        }
      }
    });
  }
  init();
})();
</script>
</body>
</html>
