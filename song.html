<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>单曲追踪 · 腾讯音乐由你榜 TOP3</title>
<script src="https://cdn.bootcdn.net/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="common.css">
<style>
    body::after { content: none; }
    .song-tables-row {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-start;
        gap: 12px;
        width: 100%;
        margin-bottom: 12px;
        min-width: 0;
    }
    .song-table-col {
        flex: 0 0 calc(50% - 6px);
        max-width: calc(50% - 6px);
        min-width: 0;
        box-sizing: border-box;
        background: white;
        border-radius: 12px;
        box-shadow: 0 4px 12px rgba(234,54,144,0.08);
        border: 1px solid rgba(234,54,144,0.10);
        padding: 12px 0;
        display: flex;
        flex-direction: column;
        height: 520px;
        overflow: hidden;
    }
    .song-table-col .title { margin: 5px 0 8px 0; }
    .song-table-col .table-scroll-box {
        width: 100%;
        overflow: hidden;
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
        flex-direction: column;
    }
    .song-table-col .recent-table {
        width: 100%;
        height: 100%;
        border-collapse: separate;
        border-spacing: 0;
        font-size: 12px;
        table-layout: fixed;
        min-width: 0;
    }
    .song-table-col .recent-table th,
    .song-table-col .recent-table td {
        padding: 8px 5px;
        text-align: center;
        border-bottom: 1px solid #f3e6ee;
        white-space: nowrap;
        line-height: 1.5;
    }
    .song-table-col .recent-table th {
        background-color: #ea3690 !important;
        color: #ffffff;
        font-weight: bold;
        font-size: 11px;
        position: sticky;
        top: 0;
        z-index: 2;
        border: 1px solid rgba(255, 255, 255, 0.3);
        box-shadow: 0 1px 0 #f3e6ee;
    }
    .song-table-col .recent-table thead tr:first-child th:first-child {
        position: sticky !important;
        top: 0 !important;
        left: 0 !important;
        z-index: 20 !important;
        background-color: #ea3690 !important;
        color: #ffffff !important;
        border: 1px solid rgba(255, 255, 255, 0.3);
    }
    .song-table-col .recent-table td:first-child {
        position: sticky;
        left: 0;
        z-index: 1;
        color: #555;
        background-color: #ffffff;
    }
    .song-table-col .recent-table tbody tr:nth-child(even) td:first-child {
        background-color: #fdf7fa;
    }
    .song-table-col .recent-table tbody tr:nth-child(even) {
        background-color: #ea36900a;
    }

    .song-chart-grid {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-start;
        gap: 12px;
        width: 100%;
        margin-bottom: 12px;
        min-width: 0;
    }
    .song-chart-grid .chart-card {
        flex: 0 0 calc(50% - 6px);
        max-width: calc(50% - 6px);
        min-width: 0;
        box-sizing: border-box;
        background: white;
        border-radius: 12px;
        box-shadow: 0 4px 12px rgba(234,54,144,0.08);
        border: 1px solid rgba(234,54,144,0.10);
        padding: 12px 0;
        display: flex;
        flex-direction: column;
        height: 420px;
        overflow: hidden;
    }
    .song-chart-grid .chart-card .title { margin: 5px 0 8px 0; }
    .song-chart-grid .chart-card .chart-wrapper-flex {
        width: 100%;
        flex: 1 1 auto;
        min-height: 0;
    }

    @media (max-width: 900px) {
        .song-table-col { flex: 0 0 100%; max-width: 100%; height: 520px; }
        .song-chart-grid .chart-card { flex: 0 0 100%; max-width: 100%; height: 360px; }
    }
</style>
</head>
<body>
<div class="container">
    <div id="loading">正在加载数据...</div>

    <div id="content" style="display:none;">
        <div class="range-hint" style="margin-bottom:8px;">
            追踪歌曲：<span id="songNameLabel" style="color:#ea3690;font-weight:bold;"></span>
        </div>

        <div class="song-tables-row">
            <div class="song-table-col">
                <div class="title">单曲 · 周榜记录（最近10条）</div>
                <div class="table-scroll-box">
                    <table class="recent-table">
                        <colgroup>
                            <col style="width: 24%;">
                            <col style="width: 19%;">
                            <col style="width: 19%;">
                            <col style="width: 19%;">
                            <col style="width: 19%;">
                        </colgroup>
                        <thead>
                            <tr id="songWeeklyTheadRow">
                                <th>时间</th>
                                <th>总分</th>
                                <th>播放热度</th>
                                <th>畅销度</th>
                                <th>推荐度</th>
                            </tr>
                        </thead>
                        <tbody id="songWeeklyTrackTableBody"></tbody>
                    </table>
                </div>
            </div>
            <div class="song-table-col">
                <div class="title">单曲 · 日榜记录（最近10条）</div>
                <div class="table-scroll-box">
                    <table class="recent-table">
                        <colgroup>
                            <col style="width: 24%;">
                            <col style="width: 19%;">
                            <col style="width: 19%;">
                            <col style="width: 19%;">
                            <col style="width: 19%;">
                        </colgroup>
                        <thead>
                            <tr id="songDailyTheadRow">
                                <th>时间</th>
                                <th>总分</th>
                                <th>播放热度</th>
                                <th>畅销度</th>
                                <th>推荐度</th>
                            </tr>
                        </thead>
                        <tbody id="songDailyTrackTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="song-chart-grid">
            <div class="chart-card">
                <div class="title">分数趋势</div>
                <div class="range-tabs" data-chart="songRange">
                    <button class="range-btn active" data-range="weekly">周榜</button>
                    <button class="range-btn" data-range="today">今天</button>
                </div>
                <div class="chart-legend-text" id="songLineLegend"></div>
                <div class="chart-wrapper-flex" id="chartSongLine"></div>
            </div>

            <div class="chart-card">
                <div class="title">三维度雷达</div>
                <div class="range-tabs" data-chart="songRadarRange">
                    <button class="range-btn active" data-range="daily">日榜</button>
                    <button class="range-btn" data-range="weekly">周榜</button>
                </div>
                <div class="chart-legend-text" id="songRadarLegend"></div>
                <div class="chart-wrapper-flex" id="chartSongRadar"></div>
            </div>
        </div>
    </div>
</div>

<script src="common.js"></script>
<script>
const TARGET_SONG_NAME = '大梦归';

const chartSongLine = echarts.init(document.getElementById('chartSongLine'));
const chartSongRadar = echarts.init(document.getElementById('chartSongRadar'));
const songCharts = [chartSongLine, chartSongRadar];
songCharts.forEach(c => c.showLoading());

let songWeeklyRecords = [];
let songDailyRecords = [];
let songLineRange = 'weekly';
let songRadarRange = 'daily';

const LINE_FIELDS = [
    { key: '得分',     label: '总分',     color: '#ea3690' },
    { key: '播放热度', label: '播放热度', color: '#7c3aed' },
    { key: '畅销度',   label: '畅销度',   color: '#f97316' },
    { key: '推荐度',   label: '推荐度',   color: '#00e268' },
];

function formatSongTime(timeStr) {
    const m = (timeStr || '').match(/(\d{4})[-/](\d{1,2})[-/](\d{1,2})[ T](\d{1,2}):(\d{1,2})/);
    if (!m) return timeStr || '';
    return `${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')} ${m[4].padStart(2, '0')}:${m[5].padStart(2, '0')}`;
}

function extractSongRecords(rows) {
    const records = [];
    rows.forEach(r => {
        const t = parseTime(r['时间']);
        if (!t) return;
        for (let rank = 1; rank <= 3; rank++) {
            const name = r[`第${rank}名歌名`] || '';
            if (name === TARGET_SONG_NAME) {
                records.push({
                    time: r['时间'],
                    ts: t.getTime(),
                    得分: parseFloat(r[`第${rank}名得分`]) || null,
                    播放热度: parseFloat(r[`第${rank}名播放热度`]) || null,
                    畅销度: parseFloat(r[`第${rank}名畅销度`]) || null,
                    推荐度: parseFloat(r[`第${rank}名推荐度`]) || null,
                });
                break;
            }
        }
    });
    records.sort((a, b) => a.ts - b.ts);

    const result = [];
    for (let i = 0; i < records.length; i++) {
        const cur = records[i];
        const prev = i > 0 ? records[i - 1] : null;
        const item = { ...cur };
        ['得分', '播放热度', '畅销度', '推荐度'].forEach(k => {
            let delta = null;
            if (prev && cur[k] !== null && prev[k] !== null) {
                delta = cur[k] - prev[k];
            }
            item[k + '_delta'] = delta;
        });
        result.push(item);
    }
    return result;
}

/* 基准点：周一 00:16（周榜）/ 当天 00:16（日榜），缺失时用范围内最早一条兜底 */
function findBaseRecord(records, mode) {
    const effectiveToday = getTodayDateForDaily();
    let baseKey;
    let rangeStart;
    let rangeEnd;

    if (mode === 'weekly') {
        const monday = getMondayOfWeek(effectiveToday);
        baseKey = `${fmtDateKey(monday)} 00:16`;
        rangeStart = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate()).getTime();
        const nextMonday = new Date(monday);
        nextMonday.setDate(nextMonday.getDate() + 7);
        rangeEnd = new Date(nextMonday.getFullYear(), nextMonday.getMonth(), nextMonday.getDate()).getTime();
    } else {
        baseKey = `${fmtDateKey(effectiveToday)} 00:16`;
        rangeStart = new Date(effectiveToday.getFullYear(), effectiveToday.getMonth(), effectiveToday.getDate()).getTime();
        rangeEnd = rangeStart + 24 * 60 * 60 * 1000;
    }

    // 1. 精确匹配 00:16
    for (const r of records) {
        const t = parseTime(r.time);
        if (!t) continue;
        const key = `${fmtDateKey(t)} ${String(t.getHours()).padStart(2, '0')}:${String(t.getMinutes()).padStart(2, '0')}`;
        if (key === baseKey) return r;
    }

    // 2. 兜底：00:16 之后最近一条（范围内）
    const baseTime = parseTime(baseKey.replace(' ', 'T')).getTime();
    let fallback = null;
    for (const r of records) {
        if (r.ts < baseTime || r.ts >= rangeEnd) continue;
        if (!fallback || r.ts < fallback.ts) fallback = r;
    }
    return fallback;
}

function updateTableHead(theadRowId, records, mode) {
    const theadRow = document.getElementById(theadRowId);
    if (!theadRow) return;

    const labels = ['总分', '播放热度', '畅销度', '推荐度'];
    const fields = ['得分', '播放热度', '畅销度', '推荐度'];
    const base = findBaseRecord(records, mode);
    const latest = records.length ? records[records.length - 1] : null;

    let html = '<th>时间</th>';
    fields.forEach((k, idx) => {
        let text = labels[idx];
        let deltaText = '-';
        if (base && latest && latest[k] !== null && base[k] !== null) {
            const totalDelta = latest[k] - base[k];
            deltaText = (totalDelta > 0 ? '+' : '') + totalDelta.toFixed(2);
        }
        text += ` / ${deltaText}`;
        html += `<th>${text}</th>`;
    });
    theadRow.innerHTML = html;
}

function renderSongTable(records, tbodyId) {
    const tbody = document.getElementById(tbodyId);
    if (!records.length) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#999;">暂无数据</td></tr>';
        return;
    }
    const recent = records.slice(-10).reverse();
    const html = recent.map(r => {
        const timeLabel = formatSongTime(r.time || '');
        const cells = [`<td>${timeLabel}</td>`];
        const fields = ['得分', '播放热度', '畅销度', '推荐度'];
        fields.forEach(k => {
            const val = r[k] !== null && r[k] !== undefined ? r[k] : '-';
            const delta = r[k + '_delta'];
            let deltaText = '-';
            let cls = '';
            if (delta !== null && delta !== undefined && !isNaN(delta)) {
                deltaText = (delta > 0 ? '+' : '') + delta.toFixed(2);
                cls = delta > 0 ? 'up' : 'flat';
            }
            cells.push(`<td><span class="val-score">${val}</span> / <span class="${cls}">${deltaText}</span></td>`);
        });
        return `<tr>${cells.join('')}</tr>`;
    }).join('');
    tbody.innerHTML = html;
}

/* 今天：从 00:16 到次日 00:06，整点取 HH:06 */
function buildTodayRecords(records) {
    const effectiveToday = getTodayDateForDaily();
    const baseKey = fmtDateKey(effectiveToday);
    const nextDay = new Date(effectiveToday);
    nextDay.setDate(nextDay.getDate() + 1);
    const nextKey = fmtDateKey(nextDay);

    const map = {};
    records.forEach(r => {
        const t = parseTime(r.time);
        if (!t || t.getMinutes() !== 6) return;
        const key = `${fmtDateKey(t)} ${String(t.getHours()).padStart(2, '0')}:06`;
        if (!map[key]) map[key] = r;
    });

    const result = [];
    const firstKey = `${baseKey} 00:16`;
    result.push(map[firstKey] || null);

    for (let h = 1; h <= 23; h++) {
        const key = `${baseKey} ${String(h).padStart(2, '0')}:06`;
        result.push(map[key] || null);
    }

    const lastKey = `${nextKey} 00:06`;
    result.push(map[lastKey] || null);

    return result;
}

function getAxisLabelsToday() {
    const labels = ['00:16'];
    for (let h = 1; h <= 23; h++) {
        labels.push(`${String(h).padStart(2, '0')}:06`);
    }
    labels.push('次日00:06');
    return labels;
}

/* 周榜：本周一到周日，每日取次日 00:06 */
function buildWeeklyPoints(records) {
    const effectiveToday = getTodayDateForDaily();
    const monday = getMondayOfWeek(effectiveToday);
    const days = [];
    for (let i = 0; i < 7; i++) {
        const d = new Date(monday);
        d.setDate(d.getDate() + i);
        days.push(d);
    }

    const rowByKey = {};
    const dayRowsMap = {};
    records.forEach(r => {
        const t = parseTime(r.time);
        if (!t) return;
        const key = `${fmtDateKey(t)} ${String(t.getHours()).padStart(2, '0')}:${String(t.getMinutes()).padStart(2, '0')}`;
        rowByKey[key] = r;

        const eff = new Date(t);
        if (t.getHours() === 0 && t.getMinutes() < 10) {
            eff.setDate(eff.getDate() - 1);
        }
        const dayKey = fmtDateKey(eff);
        if (!dayRowsMap[dayKey]) dayRowsMap[dayKey] = [];
        dayRowsMap[dayKey].push(r);
    });

    const points = [];
    const times = [];

    days.forEach(d => {
        const dayKey = fmtDateKey(d);
        const nextDay = new Date(d);
        nextDay.setDate(nextDay.getDate() + 1);
        const nextKey = fmtDateKey(nextDay);

        const row = findNextDay0006OrPrev(nextKey, rowByKey, dayRowsMap, dayKey);
        points.push(row || null);

        const label = `${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        times.push(label);
    });

    return { points, times };
}

/* ========== 折线图 ========== */
function renderSongLineChart() {
    let points = [];
    let times = [];

    if (songLineRange === 'weekly') {
        const w = buildWeeklyPoints(songWeeklyRecords);
        points = w.points;
        times = w.times;
    } else {
        const slots = buildTodayRecords(songDailyRecords);
        points = slots;
        times = getAxisLabelsToday();
    }

    const series = LINE_FIELDS.map(f => ({
        name: f.label,
        type: 'line',
        data: points.map(r => {
            if (!r) return null;
            const v = r[f.key];
            return v === null || v === undefined || isNaN(v) ? null : v;
        }),
        smooth: false,
        symbol: 'circle',
        symbolSize: 4,
        connectNulls: false,
        itemStyle: { color: f.color },
        lineStyle: { width: 2, color: f.color },
        emphasis: { focus: 'series' },
    }));

    document.getElementById('songLineLegend').innerHTML = LINE_FIELDS.map(f =>
        `<span class="item"><span class="dot" style="background:${f.color}"></span>${f.label}</span>`
    ).join('');

    let min = Infinity, max = -Infinity;
    points.forEach(r => {
        if (!r) return;
        LINE_FIELDS.forEach(f => {
            const v = r[f.key];
            if (v !== null && v !== undefined && !isNaN(v)) {
                if (v < min) min = v;
                if (v > max) max = v;
            }
        });
    });
    let yMin, yMax;
    if (!isFinite(min) || !isFinite(max)) {
        yMin = 0; yMax = 100;
    } else {
        const pad = Math.max((max - min) * 0.1, 1);
        yMin = Math.floor((min - pad) / 5) * 5;
        yMax = Math.ceil((max + pad) / 5) * 5;
        if (yMax <= yMin) yMax = yMin + 5;
        if (yMin < 0) yMin = 0;
    }

    chartSongLine.hideLoading();
    chartSongLine.setOption({
        tooltip: {
            trigger: 'axis',
            confine: true,
            formatter: function(params) {
                if (!params.length) return '';
                const i = params[0].dataIndex;
                const r = points[i];
                const timeLabel = times[i];
                let html = `<div style="font-weight:bold;margin-bottom:6px;font-size:12px;">${timeLabel}</div>`;
                if (!r) {
                    html += `<div style="color:#999;">无数据</div>`;
                    return html;
                }
                const sorted = params
                    .filter(p => p.value !== null && p.value !== undefined)
                    .sort((a, b) => b.value - a.value);
                sorted.forEach(p => {
                    const field = LINE_FIELDS.find(f => f.label === p.seriesName);
                    if (!field) return;
                    const val = r[field.key];
                    const delta = r[field.key + '_delta'];
                    let deltaText = '-';
                    let deltaColor = '#999';
                    if (delta !== null && delta !== undefined && !isNaN(delta)) {
                        deltaText = (delta > 0 ? '+' : '') + delta.toFixed(2);
                        deltaColor = delta > 0 ? '#ea3690' : '#999';
                    }
                    html += `<div style="display:flex;align-items:center;gap:12px;min-width:230px;line-height:20px;">`
                          + `<span style="display:flex;align-items:center;gap:4px;flex:1;min-width:0;">`
                          + `<span>${p.marker}</span>`
                          + `<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${p.seriesName}</span>`
                          + `<span style="margin-left:auto;font-weight:bold;color:#333;">${val !== null ? val : '-'}</span>`
                          + `</span>`
                          + `<span style="width:60px;text-align:right;white-space:nowrap;font-weight:bold;color:${deltaColor};">${deltaText}</span>`
                          + `</div>`;
                });
                return html;
            }
        },
        grid: { left: '2%', right: '5%', bottom: '15%', top: '8%', containLabel: true },
        xAxis: {
            type: 'category',
            boundaryGap: false,
            data: times,
            axisLabel: {
                interval: songLineRange === 'today' ? 1 : 'auto',
                fontSize: 10, color: '#888', rotate: 45
            },
            axisLine: { lineStyle: { color: '#f0d6e4' } },
        },
        yAxis: {
            type: 'value',
            min: yMin,
            max: yMax,
            minInterval: 1,
            axisLabel: { fontSize: 10, color: '#888' },
            axisLine: { lineStyle: { color: '#f0d6e4' } },
            splitLine: { lineStyle: { color: '#faf0f6' } },
        },
        series: series,
    }, true);
    chartSongLine.resize();
}

/* ========== 雷达图 ========== */
function renderSongRadarChart() {
    const records = songRadarRange === 'weekly' ? songWeeklyRecords : songDailyRecords;

    if (!records.length) {
        chartSongRadar.hideLoading();
        chartSongRadar.setOption({
            title: { text: '暂无数据', left: 'center', top: 'middle', textStyle: { color: '#999', fontSize: 14 } }
        }, true);
        document.getElementById('songRadarLegend').innerHTML = '';
        return;
    }

    let latest = null;
    for (let i = records.length - 1; i >= 0; i--) {
        const r = records[i];
        if (r['播放热度'] !== null && r['畅销度'] !== null && r['推荐度'] !== null) {
            latest = r;
            break;
        }
    }

    if (!latest) {
        chartSongRadar.hideLoading();
        chartSongRadar.setOption({
            title: { text: '暂无完整三维度数据', left: 'center', top: 'middle', textStyle: { color: '#999', fontSize: 14 } }
        }, true);
        document.getElementById('songRadarLegend').innerHTML = '';
        return;
    }

    const dims = [
        { name: '播放热度', key: '播放热度' },
        { name: '畅销度',   key: '畅销度' },
        { name: '推荐度',   key: '推荐度' },
    ];

    const indicators = dims.map(d => ({ name: d.name, max: 100 }));
    const value = dims.map(d => {
        const v = latest[d.key];
        return (v !== null && v !== undefined) ? v : 0;
    });

    document.getElementById('songRadarLegend').innerHTML =
        `<span class="item" style="color:#ea3690;font-weight:bold;">最近一条：${formatSongTime(latest.time || '')}</span>`;

    chartSongRadar.hideLoading();
    chartSongRadar.setOption({
        tooltip: {
            trigger: 'item',
            confine: true,
            formatter: function() {
                let html = `<div style="font-weight:bold;margin-bottom:6px;font-size:12px;">${formatSongTime(latest.time || '')}</div>`;
                dims.forEach(d => {
                    const val = latest[d.key];
                    const delta = latest[d.key + '_delta'];
                    let deltaText = '-';
                    let deltaColor = '#999';
                    if (delta !== null && delta !== undefined && !isNaN(delta)) {
                        deltaText = (delta > 0 ? '+' : '') + delta.toFixed(2);
                        deltaColor = delta > 0 ? '#ea3690' : '#999';
                    }
                    html += `<div style="display:flex;align-items:center;gap:12px;min-width:230px;line-height:20px;">`
                          + `<span style="display:flex;align-items:center;gap:4px;flex:1;min-width:0;">`
                          + `<span style="color:#999;">${d.name}</span>`
                          + `<span style="margin-left:auto;font-weight:bold;color:#333;">${val !== null ? val : '-'}</span>`
                          + `</span>`
                          + `<span style="width:60px;text-align:right;white-space:nowrap;font-weight:bold;color:${deltaColor};">${deltaText}</span>`
                          + `</div>`;
                });
                return html;
            }
        },
        radar: {
            indicator: indicators,
            center: ['50%', '55%'],
            radius: '55%',
            axisName: {
                formatter: function (name) {
                    const idx = indicators.findIndex(x => x.name === name);
                    const v = idx >= 0 ? value[idx] : '';
                    return `{name|${name}}\n{value|${v}}`;
                },
                rich: {
                    name: {
                        color: '#999',
                        fontSize: 12,
                        fontWeight: 'normal',
                        lineHeight: 18,
                    },
                    value: {
                        color: '#ea3690',
                        fontSize: 13,
                        fontWeight: 'bold',
                        lineHeight: 18,
                    },
                },
            },
            splitLine: { lineStyle: { color: '#f0d6e4' } },
            splitArea: { areaStyle: { color: ['#fdf7fa', '#ffffff'] } },
            axisLine: { lineStyle: { color: '#f0d6e4' } },
        },
        series: [{
            type: 'radar',
            data: [{
                value: value,
                name: TARGET_SONG_NAME,
                areaStyle: { color: 'rgba(234,54,144,0.25)' },
                lineStyle: { color: '#ea3690', width: 2 },
                itemStyle: { color: '#ea3690' },
            }],
        }],
    }, true);
    chartSongRadar.resize();
}

function filterThisWeek(records) {
    const effectiveToday = getTodayDateForDaily();
    const monday = getMondayOfWeek(effectiveToday);
    const weekStart = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate()).getTime();
    const nextMonday = new Date(monday);
    nextMonday.setDate(nextMonday.getDate() + 7);
    const weekEnd = new Date(nextMonday.getFullYear(), nextMonday.getMonth(), nextMonday.getDate()).getTime();
    return records.filter(r => r.ts >= weekStart && r.ts < weekEnd);
}

function filterToday(records) {
    const effectiveToday = getTodayDateForDaily();
    const start = new Date(effectiveToday.getFullYear(), effectiveToday.getMonth(), effectiveToday.getDate()).getTime();
    const end = start + 24 * 60 * 60 * 1000;
    return records.filter(r => r.ts >= start && r.ts < end);
}

(async function init() {
    document.getElementById('songNameLabel').textContent = TARGET_SONG_NAME;

    const [dailyRows, weeklyRows] = await Promise.all([
        loadCsv('uni_chart_daily.csv'),
        loadCsv('uni_chart_weekly.csv'),
    ]);

    document.getElementById('loading').style.display = 'none';
    document.getElementById('content').style.display = 'block';

    const allWeeklyRecords = extractSongRecords(weeklyRows);
    const allDailyRecords = extractSongRecords(dailyRows);

    const weeklyThisWeek = filterThisWeek(allWeeklyRecords);
    const dailyToday = filterToday(allDailyRecords);

    songWeeklyRecords = weeklyThisWeek;
    songDailyRecords = dailyToday;

    updateTableHead('songWeeklyTheadRow', songWeeklyRecords, 'weekly');
    updateTableHead('songDailyTheadRow', songDailyRecords, 'daily');

    renderSongTable(songWeeklyRecords, 'songWeeklyTrackTableBody');
    renderSongTable(songDailyRecords, 'songDailyTrackTableBody');

    renderSongLineChart();
    renderSongRadarChart();
})();

document.querySelectorAll('.range-tabs[data-chart="songRange"]').forEach(wrap => {
    wrap.querySelectorAll('.range-btn').forEach(btn => {
        btn.addEventListener('click', function() {

            renderSongLineChart();

});

document.querySelectorAll('.range-tabs[data-chart="songRadarRange"]').forEach(wrap => {
    wrap.querySelectorAll('.range-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            wrap.querySelectorAll('.range-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            songRadarRange = this.dataset.range;

        });
    });
});

let resizeTimer;
window.addEventListener('resize', function() {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function() {
        songCharts.forEach(c => c.resize());
    }, 200);
});
